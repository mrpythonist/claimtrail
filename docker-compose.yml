services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-claimtrail}
      POSTGRES_USER: ${DB_USERNAME:-claimtrail}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-claimtrail}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-claimtrail} -d ${DB_DATABASE:-claimtrail}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_NAME: ClaimTrail
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-claimtrail}
      DB_USERNAME: ${DB_USERNAME:-claimtrail}
      DB_PASSWORD: ${DB_PASSWORD:-claimtrail}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: noreply@claimtrail.example
      MAIL_FROM_NAME: ClaimTrail
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  queue:
    build: ./backend
    environment:
      APP_NAME: ClaimTrail
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-claimtrail}
      DB_USERNAME: ${DB_USERNAME:-claimtrail}
      DB_PASSWORD: ${DB_PASSWORD:-claimtrail}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: noreply@claimtrail.example
      MAIL_FROM_NAME: ClaimTrail
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan queue:work --tries=3 --timeout=60

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

volumes:
  pgdata:
  redisdata:
