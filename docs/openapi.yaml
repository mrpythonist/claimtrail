        largest_outstanding:
          type: array
          items:
            $ref: "#/components/schemas/OperationsLargestOutstanding"
    OperationsRecommendation:
      type: object
      properties:
        type: { type: string, description: "Fixed rule id, e.g. highest_rejection_broker." }
        title: { type: string }
        detail: { type: string }
        severity: { type: string, enum: [watch, note], description: "Cutoff chosen for this report, not an industry standard." }
        evidence:
          type: object
          description: The numbers the rule was derived from.
          additionalProperties: true
    OperationsRecommendations:
      type: object
      properties:
        organization_id: { type: string, format: uuid }
        from: { type: string, format: date }
        to: { type: string, format: date }
        generated_from: { type: string }
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/OperationsRecommendation"
    MonitoringCheck:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [ok, degraded, down] }
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string, enum: [ok, degraded, down, skipped] }
              latency_ms: { type: number, nullable: true }
              detail: { type: string, nullable: true }
        failed_jobs: { type: integer }
        queue_depth: { type: integer }
        checked_at: { type: string, format: date-time }
    BillingPortalSession:
