          type: object
          nullable: true
          description: Null for system rows
          properties:
            id: { type: integer }
            name: { type: string }
        action: { type: string, description: e.g. shipment.created, claim.status_changed }
        entity_type: { type: string, description: e.g. Shipment, Claim }
        entity_id: { type: string, format: uuid }
        before:
          type: object
          nullable: true
