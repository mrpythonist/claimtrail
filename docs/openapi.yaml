        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: TMS integrations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TmsIntegration"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [TMS]
      summary: Create a TMS integration
