        readiness_status: { type: string, enum: [not_started, partial, ready] }
        readiness_status_label: { type: string }
        has_requirements: { type: boolean }
        is_overridden: { type: boolean }
        disclaimer: { type: string }
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/ClaimRequirement"
    CategoryLabel:
      type: object
      properties:
        value: { type: string }
        label: { type: string }
    ClaimRequirement:
      type: object
      properties:
        document_category:
          $ref: "#/components/schemas/EvidenceDocumentCategory"
        document_category_label: { type: string }
        is_required: { type: boolean }
        is_fulfilled: { type: boolean }
        evidence_file_id: { type: string, format: uuid, nullable: true }
        snapshot_at: { type: string, format: date-time }
        overridden_by:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        override_reason: { type: string, nullable: true }
        overridden_at: { type: string, format: date-time, nullable: true }
    EvidenceRequirement:
      type: object
      properties:
        id: { type: string, format: uuid }
