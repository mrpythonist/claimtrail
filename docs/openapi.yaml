                      $ref: "#/components/schemas/ImportRow"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /imports/runs/{run}/rows/{row}/correct:
    post:
      tags: [Imports]
      summary: Correct one failed or duplicate row and retry it
      description: >
        Requires manage-imports. data is field values merged
        over the stored row data, re-validated with the
        importer's rules, with the reference re-checked against
        the database. A valid row creates the shipment and
        becomes corrected; the run counts refresh. A row that
        already imported cannot be corrected (422). A
        correction that still fails validation stores the new
        values and errors (422).
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: run
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: row
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Corrected row
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ImportRow"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /imports/schedules:
    get:
      tags: [Imports]
      summary: Scheduled imports for the organization
      description: >
        Newest first. Any member may list schedules.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImportSchedule"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Imports]
      summary: Create a scheduled import with its source file
      description: >
        Requires manage-imports. The file is stored on the
        private disk and re-run with the saved mapping. No
        live SFTP, URL, or provider source is involved.
        Daily and weekly schedules advance next_run_at after
        each run; manual schedules only run on demand. When
        next_run_at is omitted, daily defaults to tomorrow
        and weekly to next week.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, file]
              properties:
                name: { type: string, maxLength: 100 }
                import_mapping_id: { type: string, format: uuid, nullable: true }
                file: { type: string, format: binary }
                frequency: { type: string, enum: [daily, weekly, manual], default: manual }
                next_run_at: { type: string, format: date-time, nullable: true }
                active: { type: boolean, default: true }
      responses:
        "201":
          description: Created schedule
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ImportSchedule"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /imports/schedules/{schedule}:
    get:
      tags: [Imports]
      summary: One scheduled import
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: schedule
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ImportSchedule"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Imports]
      summary: Update a scheduled import
      description: >
        Requires manage-imports. A new source file replaces
        the stored one. Setting the frequency to manual clears
        next_run_at.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: schedule
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                import_mapping_id: { type: string, format: uuid, nullable: true }
                file: { type: string, format: binary }
                frequency: { type: string, enum: [daily, weekly, manual] }
                next_run_at: { type: string, format: date-time, nullable: true }
                active: { type: boolean }
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ImportSchedule"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Imports]
      summary: Delete a scheduled import
      description: >
        Requires manage-imports. Deletes the stored source
        file. Import runs the schedule produced stay in the
        history.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: schedule
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Schedule deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /imports/schedules/{schedule}/run:
    post:
      tags: [Imports]
      summary: Run a scheduled import now
      description: >
        Requires manage-imports. Runs the stored file with the
        saved mapping and returns the import run. The schedule
        advances its next run time and records the run.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: schedule
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Import run
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ImportRun"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
