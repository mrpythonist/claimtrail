        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /tms/integrations/{integration}:
    get:
      tags: [TMS]
      summary: One TMS integration
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: integration
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: TMS integration
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/TmsIntegration"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [TMS]
      summary: Update a TMS integration
      description: >
        Requires manage-tms-integrations. Credentials are
        only replaced when supplied; settings merge over
        the stored ones.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: integration
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                status: { type: string, enum: [active, disabled] }
                credentials:
                  type: object
                  additionalProperties: { type: string }
                settings:
                  type: object
                  properties:
                    sync_shipments: { type: boolean }
                    sync_status: { type: boolean }
                    sync_appointments: { type: boolean }
                    sync_documents: { type: boolean }
                    auto_sync: { type: boolean }
                    sync_interval_hours: { type: integer, minimum: 1, maximum: 168 }
      responses:
        "200":
          description: Updated TMS integration
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/TmsIntegration"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [TMS]
      summary: Delete a TMS integration
      description: >
        Requires manage-tms-integrations. Its sync runs go
        with it; shipments and evidence created by syncs
        stay.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: integration
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: TMS integration deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tms/integrations/{integration}/test:
    post:
      tags: [TMS]
      summary: Test a TMS connection
      description: >
        Requires manage-tms-integrations. Authenticates
        against the provider without syncing. The mock
        always succeeds; Trimble succeeds when the
        credentials are well-formed. Both report
        live_available false: no live TMS is reachable
        in v1.3.2.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: integration
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/TmsConnectionTest"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tms/integrations/{integration}/sync:
    post:
      tags: [TMS]
      summary: Run a TMS sync now
      description: >
        Requires manage-tms-integrations. kind is
        shipments, status, appointments, documents, or
        full (the default). A full sync runs only the
        kinds the integration settings enable. Returns
        the recorded sync run with its final status and
        summary. A run over a schema-only provider fails
        with the live-unavailable message.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: integration
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [shipments, status, appointments, documents, full] }
      responses:
        "200":
          description: Recorded sync run
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/TmsSyncRun"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /tms/sync-runs:
    get:
      tags: [TMS]
      summary: TMS sync runs for the organization
      description: >
        Newest first. Filters: tms_integration_id, kind,
        status. Any member may list sync runs.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: tms_integration_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [shipments, status, appointments, documents, full] }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, running, completed, failed] }
      responses:
        "200":
          description: TMS sync runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TmsSyncRun"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /tms/sync-runs/{syncRun}:
    get:
      tags: [TMS]
      summary: One TMS sync run
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: syncRun
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: TMS sync run
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/TmsSyncRun"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /billing/webhooks:
    post:
      tags: [Billing]
      summary: Provider webhook endpoint (public, HMAC-verified)
      description: >
        No Sanctum token: authenticity is verified by HMAC-SHA256
        signature (X-Mock-Signature: sha256=<hex>) over the raw body,
        using the configured webhook secret. Unknown event types are
        recorded as unprocessed. An exact redelivery is recorded as a
        duplicate and never applied twice.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type]
              properties:
                id: { type: string, example: evt_mock_01a211df0000000000000000 }
                type: { type: string, example: invoice.payment_failed }
                data: { type: object }
      responses:
        "200":
          description: Billing event record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      type: { type: string }
                      status: { type: string, enum: [processed, unprocessed, failed, duplicate] }
        "401":
          description: Missing or invalid webhook signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /billing/portal/{token}:
    get:
      tags: [Billing]
      summary: Billing summary for a portal token (public)
      description: >
        The token in the URL is the bearer secret, like an
        email-verify link. Unknown or expired tokens return 404.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Portal summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      organization:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          name: { type: string }
                      subscription:
                        $ref: "#/components/schemas/BillingSubscription"
                      invoices:
                        type: array
                        items:
                          $ref: "#/components/schemas/BillingInvoice"
                      portal_session_expires_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }
  /comms/providers:
    get:
      tags: [Communications]
      summary: Communication provider catalogue
      description: >-
        Every registered channel provider driver with its
        label, live availability, and whether it needs a
        webhook URL. Any member may read it. No provider in
        v1.3.3 is live: the mock records deliveries locally
        and Slack and Teams only validate the webhook shape.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Provider catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommunicationProvider"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /comms/channels:
    get:
      tags: [Communications]
      summary: List communication channels
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Communication channels, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommunicationChannel"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Communications]
      summary: Create a communication channel
      description: >-
        The webhook URL is stored encrypted and never
        returned. Slack and Teams need a well-formed
        webhook URL; the mock needs none. Requires the
        manage-communications permission.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, name]
              properties:
                provider: { type: string, enum: [mock, slack, teams] }
                name: { type: string, maxLength: 100 }
                webhook_url: { type: string, nullable: true }
                settings:
                  type: object
                  description: Event subscriptions, one boolean per event. Unset events default to true.
                  properties:
                    claim_created: { type: boolean }
                    evidence_received: { type: boolean }
                    driver_link_used: { type: boolean }
                    sync_completed: { type: boolean }
                    delivery_failed: { type: boolean }
      responses:
        "201":
          description: Communication channel
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CommunicationChannel"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /comms/channels/{channel}:
    get:
      tags: [Communications]
      summary: One communication channel
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: channel
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Communication channel
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CommunicationChannel"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Communications]
      summary: Update a communication channel
      description: >-
        The webhook URL is only replaced when supplied.
        Settings merge over the stored ones. Requires the
        manage-communications permission.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: channel
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                status: { type: string, enum: [active, disabled] }
                webhook_url: { type: string, nullable: true }
                settings:
                  type: object
                  description: Event subscriptions, one boolean per event. Merged over the stored settings.
                  properties:
                    claim_created: { type: boolean }
                    evidence_received: { type: boolean }
                    driver_link_used: { type: boolean }
                    sync_completed: { type: boolean }
                    delivery_failed: { type: boolean }
      responses:
        "200":
          description: Communication channel
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CommunicationChannel"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Communications]
      summary: Delete a communication channel
      description: >-
        Its deliveries go with it. Requires the
        manage-communications permission.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: channel
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /comms/channels/{channel}/test:
    post:
      tags: [Communications]
      summary: Test a communication channel
      description: >-
        Checks the webhook shape and records a test
        delivery. Nothing is sent to a live workspace:
        the mock records locally and Slack and Teams
        record a well-formed payload without sending it.
        A disabled channel is refused with 422.
        Requires the manage-communications permission.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: channel
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Channel test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CommunicationChannelTest"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /comms/deliveries:
    get:
      tags: [Communications]
      summary: List communication deliveries
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: communication_channel_id
          in: query
          schema: { type: string, format: uuid }
        - name: event
          in: query
          schema:
            type: string
            enum: [claim_created, evidence_received, driver_link_used, sync_completed, delivery_failed, test]
        - name: status
          in: query
          schema: { type: string, enum: [logged, sent, failed] }
      responses:
        "200":
          description: Communication deliveries, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommunicationDelivery"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /comms/deliveries/{delivery}:
    get:
      tags: [Communications]
      summary: One communication delivery
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: delivery
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Communication delivery
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CommunicationDelivery"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /comms/driver-links:
    get:
      tags: [Communications]
      summary: List driver evidence links
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: shipment_id
          in: query
          schema: { type: string, format: uuid }
        - name: claim_id
          in: query
          schema: { type: string, format: uuid }
        - name: state
          in: query
          schema: { type: string, enum: [usable, used, expired, revoked] }
      responses:
        "200":
          description: Driver evidence links, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DriverEvidenceLink"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Communications]
      summary: Create a driver evidence link
      description: >-
        The link is scoped to one shipment, one claim, or
        both, and expires after ttl_hours (1-720, default
        72) or after max_uses (1-10, default 1). The raw
        token is returned once, in this response only.
        Requires the manage-communications permission.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shipment_id: { type: string, format: uuid, nullable: true }
                claim_id: { type: string, format: uuid, nullable: true }
                driver_name: { type: string, maxLength: 255, nullable: true }
                driver_email: { type: string, format: email, nullable: true }
                ttl_hours: { type: integer, minimum: 1, maximum: 720 }
                max_uses: { type: integer, minimum: 1, maximum: 10 }
      responses:
        "201":
          description: Driver evidence link, with the token once
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DriverEvidenceLinkCreated"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /comms/driver-links/{driverLink}:
    get:
      tags: [Communications]
      summary: One driver evidence link
      description: >-
        The token is never returned again; only the link
        record, its state, and its expiry.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: driverLink
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Driver evidence link
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DriverEvidenceLink"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Communications]
      summary: Revoke a driver evidence link
      description: >-
        Revocation is immediate and permanent: the old
        URL stops working. Returns the revoked link.
        Requires the manage-communications permission.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: driverLink
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revoked driver evidence link
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DriverEvidenceLink"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /comms/driver-links/{driverLink}/resend:
    post:
      tags: [Communications]
      summary: Resend a driver evidence link
      description: >-
        Rotates the token: a fresh URL is returned once
        and the old URL stops working. The link must be
        usable and have a driver email address, or the
        resend is refused with 422. Requires the
        manage-communications permission.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: driverLink
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Driver evidence link, with the new token once
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DriverEvidenceLinkCreated"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /comms/driver-links/{driverLink}/submissions:
    get:
      tags: [Communications]
      summary: List submissions for a driver evidence link
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: driverLink
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Driver evidence submissions, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DriverEvidenceSubmission"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /driver-evidence/{token}:
    get:
      tags: [Communications]
      summary: Driver evidence page for a link token (public)
      description: >-
        No Sanctum token: the token in the URL is the
        credential, like a billing portal token. Unknown,
        expired, used-up, or revoked tokens all return 404
        with the same message, so the token alone reveals
        nothing. Rate-limited.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Driver evidence page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DriverEvidencePage"
        "404": { $ref: "#/components/responses/NotFound" }
  /driver-evidence/{token}/submit:
    post:
      tags: [Communications]
      summary: Submit evidence through a link token (public)
      description: >-
        Multipart upload. The file is stored on the
        evidence disk and verified by checksum and size
        before it is accepted. A single-use link stops
        working after this submit. Rate-limited.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document_category, file]
              properties:
                document_category:
                  type: string
                  enum: [bill_of_lading, proof_of_delivery, rate_confirmation, arrival_departure_record, appointment_confirmation, broker_communication, driver_photo, receipt, lumper_receipt, other]
                file:
                  type: string
                  format: binary
                  description: PDF, image, Office document, CSV, or text file, max 20480 KB.
                driver_name: { type: string, maxLength: 255 }
                notes: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Driver evidence submission
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DriverEvidenceSubmission"
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /reconciliation/summary:
    get:
      tags: [Reconciliation]
      summary: Organization reconciliation totals
      description: >-
        Requested, approved, paid, and outstanding totals across
        every claim with an amount, with counts by balance status.
        Any member may read it.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Reconciliation summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReconciliationSummary"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /reconciliation/ledger:
    get:
      tags: [Reconciliation]
      summary: Payment ledger
      description: >-
        Ledger payments, newest first. Query: claim_id,
        payment_method, from (paid_at), to (paid_at). Any
        member may list.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: claim_id
          in: query
          schema: { type: string, format: uuid }
        - name: payment_method
          in: query
          schema: { type: string, enum: [wire_transfer, ach, cheque, cash, card, other] }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Payment ledger
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClaimPayment"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /reconciliation/ledger/{payment}:
    get:
      tags: [Reconciliation]
      summary: One ledger payment
      description: One ledger payment. Any member may read.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: payment
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Ledger payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ClaimPayment"
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Reconciliation]
      summary: Void a ledger payment
      description: >-
        Remove a ledger payment and take its amount back out of
        the claim's paid total. A payment on a paid or closed
        claim cannot be voided. Requires manage-reconciliation.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: payment
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Payment voided
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      voided: { type: boolean }
                      payment_id: { type: string, format: uuid }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /reconciliation/claims/{claim}/payments:
    post:
      tags: [Reconciliation]
      summary: Record a ledger payment against a claim
      description: >-
        Partial payments are normal: the claim stays accepted
        until the paid total reaches the amount due, and only
        then does it move to Paid through the existing
        record-payment flow. Only accepted and partially
        accepted claims can receive payments. Requires
        manage-reconciliation.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: claim
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, payment_method, paid_at]
              properties:
                amount:
                  type: number
                  format: decimal
                  minimum: 0.01
                  maximum: 9999999999.99
                payment_method:
                  type: string
                  enum: [wire_transfer, ach, cheque, cash, card, other]
                paid_at:
                  type: string
                  format: date
                  description: Payment date, not in the future.
                payment_reference: { type: string, maxLength: 255 }
                notes: { type: string, maxLength: 1000 }
      responses:
        "201":
          description: Ledger payment recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ClaimPayment"
                  balance:
                    $ref: "#/components/schemas/ClaimBalance"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /reconciliation/claims/{claim}:
    get:
      tags: [Reconciliation]
      summary: One claim balance with payment history
      description: >-
        Requested, approved, due, paid, and outstanding for one
        claim, with its ledger payments. Any member may read.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: claim
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Claim balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ClaimBalance"
        "404": { $ref: "#/components/responses/NotFound" }
  /reconciliation/reports:
    get:
      tags: [Reconciliation]
      summary: Generated reconciliation reports
      description: Generated reports, newest first. Any member may list.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Reconciliation reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReconciliationReport"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Reconciliation]
      summary: Generate a reconciliation report
      description: >-
        Generate a report for a period (both dates default to
        the current calendar month). Generating a report only
        reads claims and stores the snapshot; it never changes
        a claim or moves money. Requires manage-reconciliation.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                period_start: { type: string, format: date }
                period_end: { type: string, format: date }
      responses:
        "201":
          description: Reconciliation report generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReconciliationReport"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /reconciliation/reports/{report}:
    get:
      tags: [Reconciliation]
      summary: One generated reconciliation report
      description: One generated report. Any member may read.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: report
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Reconciliation report
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReconciliationReport"
        "404": { $ref: "#/components/responses/NotFound" }
  /analytics/overview:
    get:
      tags: [Analytics]
      summary: Analytics overview
      description: >-
        Totals, recovery and rejection rates, average
        submission and payment times, and a comparison with
        the preceding window of the same length, over claims
        created in the range. Rates use the submitted
        population; claims still being prepared never enter a
        denominator. Query: from, to (dates, default last 12
        months). Requires view-analytics; Free plan refused
        with 402.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Analytics overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AnalyticsOverview"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /analytics/brokers:
    get:
      tags: [Analytics]
      summary: Broker performance
      description: >-
        One row per broker or customer name on the claims'
        shipments, most claims first, with counts, money,
        rates, and average payment time. Shipments with no
        broker name group under "Unknown broker". Query:
        from, to (dates, default last 12 months). Requires
        view-analytics; Free plan refused with 402.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Broker performance
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnalyticsBrokerRow"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /analytics/carriers:
    get:
      tags: [Analytics]
      summary: Carrier performance
      description: >-
        One row per carrier on the claims' shipments, most
        claims first, same columns as broker performance.
        Shipments with no carrier group under "No carrier
        assigned". Query: from, to (dates, default last 12
        months). Requires view-analytics; Free plan refused
        with 402.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Carrier performance
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnalyticsCarrierRow"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /analytics/event-types:
    get:
      tags: [Analytics]
      summary: Event-type performance
      description: >-
        One row per claim category, including categories with
        no claims in the range, same columns as broker
        performance. Query: from, to (dates, default last 12
        months). Requires view-analytics; Free plan refused
        with 402.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Event-type performance
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnalyticsEventTypeRow"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /analytics/monthly:
    get:
      tags: [Analytics]
      summary: Monthly series
      description: >-
        One point per calendar month in the range, with
        counts, money, and the recovery rate vs requested.
        Months are keyed by the claim's created_at. Query:
        from, to (dates, default last 12 months). Requires
        view-analytics; Free plan refused with 402.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Monthly series
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnalyticsMonthlyPoint"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /analytics/yearly:
    get:
      tags: [Analytics]
      summary: Yearly series
      description: >-
        One point per calendar year in the range, same fields
        as the monthly series. Query: from, to (dates,
        default last 12 months). Requires view-analytics;
        Free plan refused with 402.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Yearly series
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AnalyticsYearlyPoint"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /analytics/export:
    get:
      tags: [Analytics]
      summary: Export analytics CSV
      description: >-
        CSV download of the overview, a performance table, or
        the monthly series. Query: type (overview, brokers,
        carriers, event-types, monthly), from, to (dates,
        default last 12 months). Requires export-reports;
        Free plan refused with 402.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [overview, brokers, carriers, event-types, monthly] }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Analytics CSV
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /operations/detention-trends:
    get:
      tags: [Operational Intelligence]
      summary: Detention trend analysis
      description: >-
        Detention claims only, over claims created in the
        range: counts, recovery and rejection rates, average
        submission and payment times, the monthly series, and
        a comparison with the preceding window of the same
        length. There is no detention-hours field on a claim,
        so the trend is over detention claims and their
        recorded money, not over hours waited. Query: from,
        to (dates, default last 12 months). Requires
        view-analytics; Free plan refused with 402.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Detention trends
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/OperationsDetentionTrends"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /operations/facilities:
    get:
      tags: [Operational Intelligence]
      summary: Facility performance
      description: >-
        One row per facility as recorded on the claims'
        shipments: the delivery location where one is
        recorded, otherwise the pickup location, otherwise
        "Unnamed facility". Counts, money, rates, and average
        payment time, most claims first. Query: from, to
        (dates, default last 12 months). Requires
        view-analytics; Free plan refused with 402.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Facility performance
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OperationsFacilityRow"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /operations/rejection-reasons:
    get:
      tags: [Operational Intelligence]
      summary: Rejection reason analysis
      description: >-
        One row per recorded rejection reason over the
        rejected claims in the range, most rejections first.
        Rejected claims with nothing recorded group under
        "Not recorded". No taxonomy is invented. Query: from,
        to (dates, default last 12 months). Requires
        view-analytics; Free plan refused with 402.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Rejection reasons
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OperationsRejectionReasonRow"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /operations/missing-evidence:
    get:
      tags: [Operational Intelligence]
      summary: Missing-evidence trends
      description: >-
        Which document categories claims are missing, how
        many claims are incomplete, the average readiness,
        and the monthly trend, from the existing readiness
        computation over attached evidence against the
        organization's configured requirements. A claim with
        no configured requirements is not incomplete. Query:
        from, to (dates, default last 12 months). Requires
        view-analytics; Free plan refused with 402.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Missing-evidence trends
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/OperationsMissingEvidence"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /operations/broker-trends:
    get:
      tags: [Operational Intelligence]
      summary: Broker-level trends
      description: >-
        One row per broker or customer name, most claims
        first, with its monthly series and its change against
        the preceding window of equal length. Query: from, to
        (dates, default last 12 months). Requires
        view-analytics; Free plan refused with 402.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Broker trends
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OperationsBrokerTrendRow"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /operations/revenue-leakage:
    get:
      tags: [Operational Intelligence]
      summary: Revenue leakage analysis
      description: >-
        The gaps between recorded amounts over the submitted
        population, under the single v1.5.0 balance rule:
        requested vs approved is what the broker cut at
        approval, approved vs paid is the outstanding balance,
        overpaid is paid above the amount due, legacy is money
        recorded as paid outside the ledger. These are gaps
        between recorded numbers, not proven lost money.
        Query: from, to (dates, default last 12 months).
        Requires view-analytics; Free plan refused with 402.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Revenue leakage
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/OperationsRevenueLeakage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /operations/recommendations:
    get:
      tags: [Operational Intelligence]
      summary: Operational recommendations
      description: >-
        Fixed rules over the six analyses above. Each
        recommendation carries the numbers it was derived
        from, and each fires only when its stated minimum
        sample is met; when nothing meets a rule, no
        recommendation is invented for it. Query: from, to
        (dates, default last 12 months). Requires
        view-analytics; Free plan refused with 402.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Operational recommendations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/OperationsRecommendations"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sanctum personal access token (opaque, not a JWT)
  parameters:
    OrganizationHeader:
      name: X-Organization-Id
      in: header
      required: true
      description: UUID of the organization the request acts on
      schema: { type: string, format: uuid }
    OrganizationId:
      name: organization
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Missing organization header
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    NotFound:
      description: Not found, or not a member of the organization
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
    PlanLimitExceeded:
      description: The organization's plan limit was hit. The response names the limit and the upgrade that raises it.
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              error: { type: string, example: plan_limit_exceeded }
              limit:
                type: object
                properties:
                  resource: { type: string }
                  limit: { type: integer, nullable: true }
                  used: { type: integer }
                  plan: { type: string }
                  upgrade_plan: { type: string, nullable: true }
                  upgrade_plan_name: { type: string, nullable: true }
  schemas:
    Message:
      type: object
      properties:
        message: { type: string }
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token: { type: string }
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        email_verified_at: { type: string, format: date-time, nullable: true }
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        timezone: { type: string }
        settings: { type: object, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        current_user_role:
          $ref: "#/components/schemas/OrganizationRole"
        current_user_status: { type: string, enum: [active, inactive] }
    OrganizationRole:
      type: string
      enum:
        [owner, admin, operations_manager, dispatcher, billing_staff, viewer]
    OrganizationMember:
      type: object
      properties:
        id: { type: integer }
        organization_id: { type: string, format: uuid }
        user_id: { type: integer }
        user:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string, format: email }
        role:
          $ref: "#/components/schemas/OrganizationRole"
        role_label: { type: string }
        status: { type: string, enum: [active, inactive] }
        joined_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    OrganizationInvitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role:
          $ref: "#/components/schemas/OrganizationRole"
        role_label: { type: string }
        status: { type: string, enum: [pending, accepted, expired] }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        invited_by:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string, format: email }
        created_at: { type: string, format: date-time }
