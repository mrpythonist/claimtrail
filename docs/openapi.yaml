  /imports/runs/{run}/rows:
    get:
      tags: [Imports]
      summary: Rows of one import run, in file order
      description: >
        Filter by row status. Any member may list rows.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: run
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [imported, skipped, duplicate, failed, corrected] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
