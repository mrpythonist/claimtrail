    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        checks:
          type: object
          properties:
            database: { $ref: "#/components/schemas/HealthCheck" }
            cache: { $ref: "#/components/schemas/HealthCheck" }
            queue: { $ref: "#/components/schemas/HealthCheck" }
            storage: { $ref: "#/components/schemas/HealthCheck" }
        checked_at: { type: string, format: date-time }
    OpsHealth:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        checks:
          type: object
          properties:
            database: { $ref: "#/components/schemas/HealthCheck" }
            cache: { $ref: "#/components/schemas/HealthCheck" }
            queue: { $ref: "#/components/schemas/HealthCheck" }
            storage: { $ref: "#/components/schemas/HealthCheck" }
        checked_at: { type: string, format: date-time }
