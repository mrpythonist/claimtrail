      responses:
        "200":
          description: Paginated deadline settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeadlineSetting"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "403": { $ref: "#/components/responses/Forbidden" }
