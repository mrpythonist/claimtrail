openapi: 3.0.3
info:
  title: ClaimTrail API
  version: 1.0.1
  description: >
    Multi-tenant transportation revenue recovery API. Milestone 1 covers
    authentication, organizations, members, invitations, and the dashboard
    overview. Later milestones add shipments, events, evidence, claims,
    deadlines, PDF packages, notifications, and reports.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Organizations
  - name: Members
  - name: Invitations
  - name: Dashboard
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "422":
          description: Invalid credentials (generic message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user with organizations
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
  /auth/profile:
    put:
      tags: [Auth]
      summary: Update display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255 }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/password:
    put:
      tags: [Auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Send a password reset link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Always the same message, even for unknown emails
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset the password with the emailed token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422": { $ref: "#/components/responses/ValidationError" }
  /email/verify/{id}/{hash}:
    get:
      tags: [Auth]
      summary: Verify an email address from the signed link
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: hash
          in: path
          required: true
          schema: { type: string }
        - name: expires
          in: query
          required: true
          schema: { type: integer }
        - name: signature
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirects to the frontend verification page
  /email/verification-notification:
    post:
      tags: [Auth]
      summary: Resend the verification email
      responses:
        "200":
          description: Link sent (or already verified)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /organizations:
    get:
      tags: [Organizations]
      summary: List my organizations
      responses:
        "200":
          description: Organizations with the current user's role in each
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
    post:
      tags: [Organizations]
      summary: Create an organization (creator becomes owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255 }
                timezone: { type: string, description: IANA timezone }
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Organization"
        "422": { $ref: "#/components/responses/ValidationError" }
  /organizations/{organization}:
    get:
      tags: [Organizations]
      summary: Show one organization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Organization"
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Organizations]
      summary: Update organization settings (requires manage-organization)
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                timezone: { type: string }
                settings: { type: object, nullable: true }
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Organization"
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /organizations/{organization}/switch:
    post:
      tags: [Organizations]
      summary: Validate membership and return the organization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Organization"
        "403": { $ref: "#/components/responses/Forbidden" }
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Organization overview (member and invitation counts)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Dashboard"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /members:
    get:
      tags: [Members]
      summary: List members (paginated, searchable)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: search
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/OrganizationRole"
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Members with pagination meta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationMember"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /members/{member}:
    put:
      tags: [Members]
      summary: Change a member role or status (requires manage-members)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: member
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  $ref: "#/components/schemas/OrganizationRole"
                status: { type: string, enum: [active, inactive] }
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/OrganizationMember"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Members]
      summary: Remove a member (requires manage-members)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: member
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /invitations:
    get:
      tags: [Invitations]
      summary: List invitations (requires manage-invitations)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Invitations with pagination meta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationInvitation"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
    post:
      tags: [Invitations]
      summary: Invite an email address (requires manage-invitations)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role:
                  $ref: "#/components/schemas/OrganizationRole"
      responses:
        "201":
          description: Invitation created and emailed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/OrganizationInvitation"
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /invitations/accept:
    post:
      tags: [Invitations]
      summary: Accept an invitation with the emailed token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Membership created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  organization_id: { type: string, format: uuid }
        "403":
          description: Invitation was sent to a different email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Invalid or expired invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /invitations/{invitation}:
    delete:
      tags: [Invitations]
      summary: Revoke a pending invitation (requires manage-invitations)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: invitation
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Invitation revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sanctum personal access token (opaque, not a JWT)
  parameters:
    OrganizationHeader:
      name: X-Organization-Id
      in: header
      required: true
      description: UUID of the organization the request acts on
      schema: { type: string, format: uuid }
    OrganizationId:
      name: organization
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Missing organization header
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    NotFound:
      description: Not found, or not a member of the organization
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
  schemas:
    Message:
      type: object
      properties:
        message: { type: string }
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token: { type: string }
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        email_verified_at: { type: string, format: date-time, nullable: true }
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        timezone: { type: string }
        settings: { type: object, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        current_user_role:
          $ref: "#/components/schemas/OrganizationRole"
        current_user_status: { type: string, enum: [active, inactive] }
    OrganizationRole:
      type: string
      enum:
        [owner, admin, operations_manager, dispatcher, billing_staff, viewer]
    OrganizationMember:
      type: object
      properties:
        id: { type: integer }
        organization_id: { type: string, format: uuid }
        user_id: { type: integer }
        user:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string, format: email }
        role:
          $ref: "#/components/schemas/OrganizationRole"
        role_label: { type: string }
        status: { type: string, enum: [active, inactive] }
        joined_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    OrganizationInvitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role:
          $ref: "#/components/schemas/OrganizationRole"
        role_label: { type: string }
        status: { type: string, enum: [pending, accepted, expired] }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        invited_by:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string, format: email }
        created_at: { type: string, format: date-time }
    Dashboard:
      type: object
      properties:
        organization:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
            timezone: { type: string }
            created_at: { type: string, format: date-time }
        current_user_role:
          $ref: "#/components/schemas/OrganizationRole"
        member_since: { type: string, format: date-time, nullable: true }
        counts:
          type: object
          properties:
            members_total: { type: integer }
            members_active: { type: integer }
            members_inactive: { type: integer }
            invitations_pending: { type: integer }
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
