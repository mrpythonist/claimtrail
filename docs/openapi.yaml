      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope_type: { type: string, enum: [global, claim_category, event_category] }
                scope_value: { type: string, nullable: true }
                submit_within_days: { type: integer, minimum: 1, maximum: 365 }
                reminder_days_before:
                  type: array
                  items: { type: integer, minimum: 0, maximum: 90 }
      responses:
        "200":
          description: Deadline setting updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DeadlineSetting"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Customization]
      summary: Delete a deadline setting (requires manage-customization)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: setting
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deadline setting deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /export-templates/available-columns:
    get:
      tags: [Customization]
      summary: List columns available for export templates (requires manage-customization)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: resource_type
          in: query
          required: true
          schema: { type: string, enum: [shipment, claim] }
      responses:
        "200":
          description: Fixed columns plus one custom entry per active custom field
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /export-templates:
    get:
      tags: [Customization]
      summary: List export templates (requires manage-customization)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: resource_type
          in: query
          schema: { type: string, enum: [shipment, claim] }
      responses:
        "200":
          description: Paginated export templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExportTemplate"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Customization]
      summary: Create an export template (requires manage-customization)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_type, name, columns]
              properties:
                resource_type: { type: string, enum: [shipment, claim] }
                name: { type: string, maxLength: 255 }
                columns:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items: { type: string }
                is_default: { type: boolean }
      responses:
        "201":
          description: Export template created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ExportTemplate"
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /export-templates/{template}:
    get:
      tags: [Customization]
      summary: Show one export template (requires manage-customization)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: template
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Export template
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ExportTemplate"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Customization]
      summary: Update an export template (requires manage-customization)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: template
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                columns:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items: { type: string }
                is_default: { type: boolean }
      responses:
        "200":
          description: Export template updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ExportTemplate"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Customization]
      summary: Delete an export template (requires manage-customization)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: template
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Export template deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /export-templates/{template}/set-default:
    post:
      tags: [Customization]
      summary: Make an export template the default (requires manage-customization)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: template
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Export template is now the default
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ExportTemplate"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sanctum personal access token (opaque, not a JWT)
  parameters:
    OrganizationHeader:
      name: X-Organization-Id
      in: header
      required: true
      description: UUID of the organization the request acts on
      schema: { type: string, format: uuid }
    OrganizationId:
      name: organization
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Missing organization header
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    NotFound:
      description: Not found, or not a member of the organization
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
  schemas:
    Message:
      type: object
      properties:
        message: { type: string }
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token: { type: string }
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        email_verified_at: { type: string, format: date-time, nullable: true }
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        timezone: { type: string }
        settings: { type: object, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        current_user_role:
          $ref: "#/components/schemas/OrganizationRole"
        current_user_status: { type: string, enum: [active, inactive] }
    OrganizationRole:
      type: string
      enum:
        [owner, admin, operations_manager, dispatcher, billing_staff, viewer]
    OrganizationMember:
      type: object
      properties:
        id: { type: integer }
        organization_id: { type: string, format: uuid }
        user_id: { type: integer }
        user:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string, format: email }
        role:
          $ref: "#/components/schemas/OrganizationRole"
        role_label: { type: string }
        status: { type: string, enum: [active, inactive] }
        joined_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    OrganizationInvitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role:
          $ref: "#/components/schemas/OrganizationRole"
        role_label: { type: string }
        status: { type: string, enum: [pending, accepted, expired] }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        invited_by:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string, format: email }
        created_at: { type: string, format: date-time }
    Dashboard:
      type: object
      properties:
        organization:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            slug: { type: string }
            timezone: { type: string }
            created_at: { type: string, format: date-time }
        current_user_role:
          $ref: "#/components/schemas/OrganizationRole"
        member_since: { type: string, format: date-time, nullable: true }
        counts:
          type: object
          properties:
            members_total: { type: integer }
            members_active: { type: integer }
            members_inactive: { type: integer }
            invitations_pending: { type: integer }
            shipments_total: { type: integer }
            shipments_with_events: { type: integer }
            shipments_with_opportunities: { type: integer, description: Shipments with at least one event in potential status }
            events_open: { type: integer }
            events_total: { type: integer }
            evidence_total: { type: integer }
            claims_total: { type: integer }
            claims_open: { type: integer, description: potential, evidence_required, under_review, ready_to_submit }
            claims_open_opportunities: { type: integer, description: potential, evidence_required, under_review }
            claims_awaiting_evidence: { type: integer }
            claims_ready: { type: integer }
            claims_submitted: { type: integer, description: Status submitted only }
            claims_approved: { type: integer, description: accepted plus partially_accepted }
            claims_rejected: { type: integer }
            claims_paid: { type: integer }
            claims_closed: { type: integer }
            deadlines_upcoming: { type: integer }
            deadlines_due_soon: { type: integer }
            deadlines_overdue: { type: integer }
            deadlines_next_14_days: { type: integer }
        claims_by_status:
          type: array
          description: One entry per claim status, zero-filled
          items:
            type: object
            properties:
              status:
                $ref: "#/components/schemas/ClaimStatus"
              label: { type: string }
              count: { type: integer }
        financials:
          type: object
          description: Per-currency money figures. Potential is estimated money, never recovered.
          properties:
            potential:
              type: array
              items:
                $ref: "#/components/schemas/MoneyAmount"
            submitted:
              type: array
              items:
                $ref: "#/components/schemas/MoneyAmount"
            accepted:
              type: array
              items:
                $ref: "#/components/schemas/MoneyAmount"
            recovered:
              type: array
              items:
                $ref: "#/components/schemas/MoneyAmount"
        upcoming_deadlines:
          type: array
          description: Next five active deadlines due within 14 days, soonest first
          items:
            type: object
            properties:
              deadline_id: { type: string, format: uuid }
              claim_id: { type: string, format: uuid }
              claim_reference: { type: string }
              deadline_at: { type: string, format: date-time }
              status: { type: string, enum: [upcoming, due_soon, overdue, met, missed] }
              status_label: { type: string }
        filters:
          type: object
          properties:
            date_from: { type: string, format: date, nullable: true }
            date_to: { type: string, format: date, nullable: true }
            status:
              $ref: "#/components/schemas/ClaimStatus"
        claims_filtered:
          type: object
          description: Present only when a status filter is given
          properties:
            status:
              $ref: "#/components/schemas/ClaimStatus"
            label: { type: string }
            count: { type: integer }
            requested_amounts:
              type: array
              items:
                $ref: "#/components/schemas/MoneyAmount"
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
    Carrier:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string }
        contact_name: { type: string, nullable: true }
        contact_email: { type: string, format: email, nullable: true }
        contact_phone: { type: string, nullable: true }
        dot_number: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ShipmentStatus:
      type: string
      enum: [draft, planned, in_transit, delivered, completed, archived]
    CustomField:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        resource_type: { type: string, enum: [shipment, claim] }
        field_key: { type: string }
        label: { type: string }
        field_type: { type: string, enum: [text, number, date, select, boolean] }
        is_required: { type: boolean }
        options:
          type: array
          items: { type: string }
          nullable: true
        sort_order: { type: integer }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EvidenceTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              document_category: { type: string }
              document_category_label: { type: string }
              label: { type: string }
              is_required: { type: boolean }
              sort_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DeadlineSetting:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        scope_type: { type: string, enum: [global, claim_category, event_category] }
        scope_value: { type: string, nullable: true }
        submit_within_days: { type: integer }
        reminder_days_before:
          type: array
          items: { type: integer }
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ExportTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        resource_type: { type: string, enum: [shipment, claim] }
        name: { type: string }
        columns:
          type: array
          items: { type: string }
        is_default: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Shipment:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        internal_reference: { type: string }
        external_load_reference: { type: string, nullable: true }
        broker_or_customer_name: { type: string }
        carrier_id: { type: string, format: uuid, nullable: true }
        carrier:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        driver_name: { type: string, nullable: true }
        driver_contact: { type: string, nullable: true }
        pickup_location: { type: string, nullable: true }
        delivery_location: { type: string, nullable: true }
        pickup_appointment: { type: string, format: date-time, nullable: true }
        delivery_appointment: { type: string, format: date-time, nullable: true }
        actual_arrival_at: { type: string, format: date-time, nullable: true }
        actual_departure_at: { type: string, format: date-time, nullable: true }
        base_rate: { type: string, nullable: true, description: Decimal string, e.g. "1450.00" }
        currency: { type: string }
        status:
          $ref: "#/components/schemas/ShipmentStatus"
        status_label: { type: string }
        notes: { type: string, nullable: true }
        custom_field_values:
          type: object
          additionalProperties: true
          description: Values keyed by custom field key
        created_by:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        events_count: { type: integer }
        evidence_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ShipmentInput:
      type: object
      required: [internal_reference, broker_or_customer_name]
      properties:
        internal_reference: { type: string, maxLength: 255 }
        external_load_reference: { type: string, maxLength: 255, nullable: true }
        broker_or_customer_name: { type: string, maxLength: 255 }
        carrier_id: { type: string, format: uuid, nullable: true }
        driver_name: { type: string, maxLength: 255, nullable: true }
        driver_contact: { type: string, maxLength: 255, nullable: true }
        pickup_location: { type: string, maxLength: 500, nullable: true }
        delivery_location: { type: string, maxLength: 500, nullable: true }
        pickup_appointment: { type: string, format: date-time, nullable: true }
        delivery_appointment: { type: string, format: date-time, nullable: true }
        actual_arrival_at: { type: string, format: date-time, nullable: true }
        actual_departure_at: { type: string, format: date-time, nullable: true }
        base_rate: { type: number, minimum: 0, nullable: true }
        currency: { type: string, minLength: 3, maxLength: 3, nullable: true }
        status:
          $ref: "#/components/schemas/ShipmentStatus"
        notes: { type: string, maxLength: 5000, nullable: true }
        custom_field_values:
          type: object
          additionalProperties: true
          description: Values keyed by custom field key, validated against the active definitions
    ImportPreview:
      type: object
      properties:
        preview_token: { type: string }
        summary:
          type: object
          properties:
            total: { type: integer }
            valid: { type: integer }
            invalid: { type: integer }
            duplicate: { type: integer }
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              data: { type: object, description: Mapped shipment fields }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
              is_duplicate: { type: boolean }
              valid: { type: boolean }
    ImportResult:
      type: object
      properties:
        imported: { type: integer }
        skipped: { type: integer }
        skipped_rows:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              reason: { type: string }
              is_duplicate: { type: boolean }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
    SavedView:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        resource_type:
          type: string
          enum: [shipment, claim]
        name: { type: string }
        filters:
          type: object
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SavedViewInput:
      type: object
      required: [name, resource_type, filters]
      properties:
        name: { type: string, maxLength: 100 }
        resource_type:
          type: string
          enum: [shipment, claim]
        filters:
          type: object
          additionalProperties: { type: string }
    OnboardingProgress:
      type: object
      properties:
        steps:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              description: { type: string }
              href: { type: string }
              completed: { type: boolean }
        completed_count: { type: integer }
        total_count: { type: integer }
        all_completed: { type: boolean }
        dismissed: { type: boolean }
    ReviewNote:
      type: object
      properties:
        id: { type: string, format: uuid }
        claim_id: { type: string, format: uuid }
        note: { type: string }
        author:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        created_at: { type: string, format: date-time }
    BulkFailure:
      type: object
      properties:
        id: { type: string, format: uuid }
        reason: { type: string }
    BulkIdResult:
      type: object
      properties:
        updated:
          type: array
          items: { type: string, format: uuid }
        deleted:
          type: array
          items: { type: string, format: uuid }
        failed:
          type: array
          items:
            $ref: "#/components/schemas/BulkFailure"
    BulkClaimResult:
      type: object
      properties:
        updated:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              claim_reference: { type: string }
              status:
                $ref: "#/components/schemas/ClaimStatus"
        failed:
          type: array
          items:
            $ref: "#/components/schemas/BulkFailure"
    EventCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        label: { type: string }
        description: { type: string, nullable: true }
        is_system: { type: boolean }
        is_active: { type: boolean }
        default_estimated_amount: { type: string, nullable: true, description: Decimal string }
        default_currency: { type: string, nullable: true }
    ShipmentEventStatus:
      type: string
      enum: [potential, under_review, dismissed]
    ShipmentEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        shipment_id: { type: string, format: uuid }
        event_category_id: { type: string, format: uuid }
        category:
          type: object
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            label: { type: string }
        event_date: { type: string, format: date }
        start_time: { type: string, nullable: true, description: HH:MM }
        end_time: { type: string, nullable: true, description: HH:MM }
        duration_minutes: { type: integer, nullable: true }
        location: { type: string, nullable: true }
        description: { type: string, nullable: true }
        estimated_amount: { type: string, nullable: true, description: Decimal string }
        currency: { type: string }
        notes: { type: string, nullable: true }
        reported_by:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        status:
          $ref: "#/components/schemas/ShipmentEventStatus"
        status_label: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ShipmentEventInput:
      type: object
      required: [event_category_id, event_date]
      properties:
        event_category_id: { type: string, format: uuid }
        event_date: { type: string, format: date }
        start_time: { type: string, pattern: "^\\d{2}:\\d{2}$", nullable: true }
        end_time: { type: string, pattern: "^\\d{2}:\\d{2}$", nullable: true }
        duration_minutes: { type: integer, minimum: 0, maximum: 10080, nullable: true }
        location: { type: string, maxLength: 500, nullable: true }
        description: { type: string, maxLength: 5000, nullable: true }
        estimated_amount: { type: number, minimum: 0, nullable: true }
        currency: { type: string, minLength: 3, maxLength: 3, nullable: true }
        notes: { type: string, maxLength: 5000, nullable: true }
    EvidenceDocumentCategory:
      type: string
      enum:
        [bill_of_lading, proof_of_delivery, rate_confirmation,
         arrival_departure_record, appointment_confirmation,
         broker_communication, driver_photo, receipt, lumper_receipt, other]
    EvidenceVerificationStatus:
      type: string
      enum: [pending, verified, rejected]
    EvidenceFile:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        shipment_id: { type: string, format: uuid }
        shipment_event_id: { type: string, format: uuid, nullable: true }
        document_category:
          $ref: "#/components/schemas/EvidenceDocumentCategory"
        document_category_label: { type: string }
        original_filename: { type: string }
        mime_type: { type: string }
        file_size: { type: integer }
        previewable:
          type: boolean
          description: True for images (JPEG, PNG, WebP) and PDFs; other types download instead
        uploaded_by:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        description: { type: string, nullable: true }
        verification_status:
          $ref: "#/components/schemas/EvidenceVerificationStatus"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ClaimStatus:
      type: string
      enum:
        [potential, evidence_required, under_review, ready_to_submit,
         submitted, accepted, partially_accepted, rejected, paid, closed]
    ClaimCategory:
      type: string
      enum:
        [detention, layover, tonu, lumper, additional_stop,
         additional_miles, other]
    Claim:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        claim_reference: { type: string, description: "Per-organization reference, e.g. CLM-2026-0001" }
        shipment_id: { type: string, format: uuid }
        shipment:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            internal_reference: { type: string }
            broker_or_customer_name: { type: string }
            status: { type: string }
        shipment_event_id: { type: string, format: uuid, nullable: true }
        event:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            event_date: { type: string, format: date }
            description: { type: string, nullable: true }
        claim_category:
          $ref: "#/components/schemas/ClaimCategory"
        claim_category_label: { type: string }
        description: { type: string, nullable: true }
        requested_amount: { type: string, description: Decimal string }
        accepted_amount: { type: string, nullable: true, description: Decimal string, set only on acceptance }
        recovered_amount: { type: string, nullable: true, description: Decimal string, set only by payment recording }
        currency: { type: string }
        internal_notes: { type: string, nullable: true }
        external_broker_reference: { type: string, nullable: true }
        submission_deadline_at: { type: string, format: date-time, nullable: true }
        submitted_at: { type: string, format: date-time, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        rejected_at: { type: string, format: date-time, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
        rejection_reason: { type: string, nullable: true }
        payment_reference: { type: string, nullable: true }
        status:
          $ref: "#/components/schemas/ClaimStatus"
        status_label: { type: string }
        custom_field_values:
          type: object
          additionalProperties: true
          description: Values keyed by custom field key
        allowed_transitions:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              label: { type: string }
        created_by:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        updated_by:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        evidence_count: { type: integer }
        active_deadline:
          $ref: "#/components/schemas/ClaimDeadline"
        latest_document:
          $ref: "#/components/schemas/GeneratedDocument"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ClaimInput:
      type: object
      required: [shipment_id, requested_amount]
      properties:
        shipment_id: { type: string, format: uuid }
        shipment_event_id: { type: string, format: uuid, nullable: true }
        claim_category:
          $ref: "#/components/schemas/ClaimCategory"
        description: { type: string, maxLength: 5000, nullable: true }
        requested_amount: { type: number, minimum: 0.01 }
        currency: { type: string, minLength: 3, maxLength: 3, nullable: true }
        internal_notes: { type: string, maxLength: 5000, nullable: true }
        external_broker_reference: { type: string, maxLength: 255, nullable: true }
        submission_deadline_at: { type: string, format: date-time, nullable: true }
        custom_field_values:
          type: object
          additionalProperties: true
          description: Values keyed by custom field key, validated against the active definitions
    ClaimTransitionInput:
      type: object
      required: [to_status]
      properties:
        to_status:
          $ref: "#/components/schemas/ClaimStatus"
        reason: { type: string, maxLength: 2000, nullable: true, description: Required when closing before submission }
        accepted_amount:
          type: number
          minimum: 0.01
          nullable: true
          description: Required when accepting; must be below requested when partially accepting
        rejection_reason: { type: string, maxLength: 2000, nullable: true, description: Required when rejecting }
        submitted_at: { type: string, format: date-time, nullable: true, description: Stamped automatically on submission when omitted }
    PaymentInput:
      type: object
      required: [recovered_amount, payment_date]
      properties:
        recovered_amount: { type: number, minimum: 0.01 }
        payment_date: { type: string, format: date }
        payment_reference: { type: string, maxLength: 255, nullable: true }
        reason: { type: string, maxLength: 2000, nullable: true }
    ClaimStatusHistory:
      type: object
      properties:
        id: { type: string, format: uuid }
        claim_id: { type: string, format: uuid }
        from_status: { type: string, nullable: true }
        to_status: { type: string }
        changed_by:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        reason: { type: string, nullable: true }
        metadata: { type: object, nullable: true }
        created_at: { type: string, format: date-time }
    Readiness:
      type: object
      properties:
        claim_id: { type: string, format: uuid }
        required:
          type: array
          items:
            $ref: "#/components/schemas/CategoryLabel"
        optional:
          type: array
          items:
            $ref: "#/components/schemas/CategoryLabel"
        collected:
          type: array
          items:
            $ref: "#/components/schemas/CategoryLabel"
        missing:
          type: array
          items:
            $ref: "#/components/schemas/CategoryLabel"
        optional_collected:
          type: array
          items:
            $ref: "#/components/schemas/CategoryLabel"
