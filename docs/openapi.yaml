        source_reference: { type: string, maxLength: 2000, nullable: true }
        reminder_days_before:
          type: array
          maxItems: 10
          items: { type: integer, minimum: 0, maximum: 90 }
    GeneratedDocumentStatus:
      type: string
      enum: [queued, ready, failed]
    GeneratedDocument:
      type: object
      properties:
        id: { type: string, format: uuid }
        claim_id: { type: string, format: uuid }
        document_type: { type: string }
        document_type_label: { type: string }
        file_size: { type: integer, nullable: true }
        generated_by:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        includes_internal_notes: { type: boolean }
        status:
          $ref: "#/components/schemas/GeneratedDocumentStatus"
        status_label: { type: string }
        error_message: { type: string, nullable: true }
        generated_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        actor_type: { type: string, enum: [user, system] }
