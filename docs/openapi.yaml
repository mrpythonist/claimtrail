        connection: { type: string }
        queue: { type: string }
        job: { type: string, description: Short class name of the job }
        failed_at: { type: string, format: date-time }
        exception: { type: string, description: Truncated to 2000 characters }
    ErrorEntry:
      type: object
      properties:
        datetime: { type: string, format: date-time, nullable: true }
        level: { type: string, nullable: true }
        message: { type: string }
        exception: { type: string, nullable: true }
        route: { type: string, nullable: true }
        method: { type: string, nullable: true }
        correlation_id: { type: string, nullable: true }
