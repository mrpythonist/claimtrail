        event_category_id: { type: string, format: uuid, nullable: true }
        event_category:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            label: { type: string }
        document_category:
          $ref: "#/components/schemas/EvidenceDocumentCategory"
        document_category_label: { type: string }
        is_required: { type: boolean }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EvidenceRequirementInput:
      type: object
      required: [document_category]
      properties:
        event_category_id: { type: string, format: uuid, nullable: true, description: Null means every event type }
        document_category:
          $ref: "#/components/schemas/EvidenceDocumentCategory"
        is_required: { type: boolean, default: true }
        notes: { type: string, maxLength: 2000, nullable: true }
    DeadlineStatus:
      type: string
      enum: [upcoming, due_soon, overdue, met, missed]
    ClaimDeadline:
      type: object
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        claim_id: { type: string, format: uuid }
        claim:
          type: object
          properties:
            id: { type: string, format: uuid }
            claim_reference: { type: string }
            status: { type: string }
            status_label: { type: string }
        deadline_at: { type: string, format: date-time }
        timezone: { type: string }
        source_reference: { type: string, nullable: true }
        reminder_days_before:
          type: array
          items: { type: integer }
        status:
          $ref: "#/components/schemas/DeadlineStatus"
        status_label: { type: string }
        superseded_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ClaimDeadlineInput:
      type: object
