          $ref: "#/components/schemas/NotificationType"
        label: { type: string }
        in_app: { type: boolean }
        email: { type: boolean }
    MoneyAmount:
      type: object
      description: One money figure in one currency. Currencies are never mixed.
      properties:
        currency: { type: string, description: ISO currency code, e.g. USD }
        amount: { type: string, description: Two-decimal money string, e.g. "250.00" }
    ReportSummary:
      type: object
      properties:
        counts_by_status:
          type: array
          description: One entry per claim status, zero-filled
          items:
            type: object
            properties:
              status:
                $ref: "#/components/schemas/ClaimStatus"
              label: { type: string }
              count: { type: integer }
        counts_by_event_type:
          type: array
          description: One entry per claim category, zero-filled
          items:
            type: object
            properties:
              category:
                $ref: "#/components/schemas/ClaimCategory"
              label: { type: string }
              count: { type: integer }
        money:
          type: object
          description: Six figures, each a per-currency breakdown. See docs/API.md for definitions.
          properties:
            potential:
              type: array
              items:
                $ref: "#/components/schemas/MoneyAmount"
            submitted:
              type: array
              items:
                $ref: "#/components/schemas/MoneyAmount"
            accepted:
              type: array
              items:
                $ref: "#/components/schemas/MoneyAmount"
            recovered:
              type: array
              items:
                $ref: "#/components/schemas/MoneyAmount"
            rejected:
              type: array
              items:
                $ref: "#/components/schemas/MoneyAmount"
            outstanding:
              type: array
              items:
                $ref: "#/components/schemas/MoneyAmount"
