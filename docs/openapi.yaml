openapi: 3.0.3
info:
  title: ClaimTrail API
  version: 1.5.2
  description: >
    Multi-tenant transportation revenue recovery API. Milestones 1, 2,
    3, and 4 cover authentication, organizations, members, invitations,
    the dashboard, carriers, shipments, CSV import and export, shipment
    events, event categories, evidence, claims, evidence readiness,
    deadlines, claim package PDFs, the audit trail, notifications, and
    reports. Version 1.1.0 adds guided onboarding, bulk shipment and
    claim operations, advanced search and filters, saved list views,
    per-row CSV import errors, inline evidence previews, and claim
    review notes with an approve / request-changes review action.
    Version 1.1.1 adds a public health endpoint and operations
    endpoints (queue monitoring, failed-job handling, recent errors)
    for organization admins. Version 1.1.2 adds customization:
    custom shipment and claim fields, event category updates and
    defaults, evidence templates, deadline settings, export
    templates, a claims CSV export, and organization settings
    for a default currency, a date format, and a claim reference
    prefix. Version 1.1.3 adds security and operations: backups,
    retention settings, production-readiness checks, and the
    security event log, all for owners and admins. Version 1.2.0
    adds subscription billing on a mock provider: plans, checkout,
    trials, plan changes, cancellations, invoices, payment methods,
    and metered success-fee billing. Version 1.2.1 adds plan limit
    enforcement with 402 responses and downgrade carryover.
    Version 1.2.2 adds the public marketing API: plan catalog,
    lead capture, and analytics events. Version 1.2.3 adds
    production launch: support tickets, invoice refunds, the
    billing event log, and production monitoring. Version 1.3.0
    adds email intake: organization-specific inbound addresses,
    the HMAC-signed inbound webhook, attachment extraction,
    shipment reference extraction, automatic shipment matching,
    and manual matching with processing history. Version 1.3.1
    adds advanced imports: saved CSV mappings, import history
    with row-level error correction, scheduled imports, import
    notifications, and synchronization workflows over stored
    files. Version 1.3.2 adds TMS integrations: a generic
    provider adapter with a mock provider and Trimble
    TMW.Suite modelled schema-only, integration settings,
    connection tests, syncs, and sync monitoring. Version 1.3.3
    adds communication integrations: Slack and Teams channels,
    driver evidence submission links, and email workflows.
    Version 1.5.0 adds financial reconciliation: the claim
    payment ledger, outstanding balances, and reconciliation
    reports. Version 1.5.1 adds advanced analytics: recovery
    and rejection rates, average submission and payment times,
    broker, carrier, and event-type performance, monthly and
    yearly comparisons, and CSV exports.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Organizations
  - name: Members
  - name: Invitations
  - name: Dashboard
  - name: Carriers
  - name: Shipments
  - name: Events
  - name: Evidence
  - name: Claims
  - name: Readiness
  - name: Deadlines
  - name: Documents
  - name: Audit
  - name: Notifications
  - name: Reports
  - name: Onboarding
  - name: SavedViews
  - name: Operations
  - name: Customization
  - name: Security
  - name: Billing
  - name: Support
  - name: EmailIntake
  - name: Imports
  - name: TMS
  - name: Communications
  - name: Reconciliation
  - name: Analytics
  - name: Operational Intelligence
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email, maxLength: 255 }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "422":
          description: Invalid credentials (generic message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user with organizations
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
  /auth/profile:
    put:
      tags: [Auth]
      summary: Update display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255 }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/password:
    put:
      tags: [Auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Send a password reset link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Always the same message, even for unknown emails
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset the password with the emailed token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string }
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422": { $ref: "#/components/responses/ValidationError" }
  /email/verify/{id}/{hash}:
    get:
      tags: [Auth]
      summary: Verify an email address from the signed link
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: hash
          in: path
          required: true
          schema: { type: string }
        - name: expires
          in: query
          required: true
          schema: { type: integer }
        - name: signature
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirects to the frontend verification page
  /email/verification-notification:
    post:
      tags: [Auth]
      summary: Resend the verification email
      responses:
        "200":
          description: Link sent (or already verified)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /organizations:
    get:
      tags: [Organizations]
      summary: List my organizations
      responses:
        "200":
          description: Organizations with the current user's role in each
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
    post:
      tags: [Organizations]
      summary: Create an organization (creator becomes owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255 }
                timezone: { type: string, description: IANA timezone }
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Organization"
        "422": { $ref: "#/components/responses/ValidationError" }
  /organizations/{organization}:
    get:
      tags: [Organizations]
      summary: Show one organization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Organization"
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Organizations]
      summary: Update organization settings (requires manage-organization)
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                timezone: { type: string }
                settings: { type: object, nullable: true }
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Organization"
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /organizations/{organization}/switch:
    post:
      tags: [Organizations]
      summary: Validate membership and return the organization
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Organization"
        "403": { $ref: "#/components/responses/Forbidden" }
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Organization overview (counts, financials, upcoming deadlines)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: date_from
          in: query
          description: Filter shipment and claim created_at (inclusive)
          schema: { type: string, format: date }
        - name: date_to
          in: query
          description: Filter shipment and claim created_at (inclusive)
          schema: { type: string, format: date }
        - name: status
          in: query
          description: Adds a claims_filtered section for this claim status
          schema:
            $ref: "#/components/schemas/ClaimStatus"
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Dashboard"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /onboarding:
    get:
      tags: [Onboarding]
      summary: Onboarding progress for the organization (any member)
      description: >
        Steps are derived live from the organization's data; only the
        dismissal is stored.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Onboarding progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/OnboardingProgress"
        "403": { $ref: "#/components/responses/Forbidden" }
  /onboarding/dismiss:
    post:
      tags: [Onboarding]
      summary: Dismiss the onboarding checklist (requires manage-organization)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Dismissed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      dismissed: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
  /saved-views:
    get:
      tags: [SavedViews]
      summary: List the member's saved views, optionally by resource type
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: resource_type
          in: query
          schema:
            type: string
            enum: [shipment, claim]
      responses:
        "200":
          description: Saved views
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SavedView"
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [SavedViews]
      summary: Save the current list filters as a named view
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedViewInput"
      responses:
        "201":
          description: Saved view created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SavedView"
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /saved-views/{savedView}:
    put:
      tags: [SavedViews]
      summary: Rename a saved view or replace its filters (owner only)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: savedView
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                filters:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "200":
          description: Saved view updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SavedView"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [SavedViews]
      summary: Delete a saved view (owner only)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: savedView
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Saved view deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404": { $ref: "#/components/responses/NotFound" }
  /members:
    get:
      tags: [Members]
      summary: List members (paginated, searchable)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: search
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/OrganizationRole"
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Members with pagination meta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationMember"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /members/{member}:
    put:
      tags: [Members]
      summary: Change a member role or status (requires manage-members)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: member
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  $ref: "#/components/schemas/OrganizationRole"
                status: { type: string, enum: [active, inactive] }
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/OrganizationMember"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Members]
      summary: Remove a member (requires manage-members)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: member
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /invitations:
    get:
      tags: [Invitations]
      summary: List invitations (requires manage-invitations)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Invitations with pagination meta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrganizationInvitation"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
    post:
      tags: [Invitations]
      summary: Invite an email address (requires manage-invitations)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role:
                  $ref: "#/components/schemas/OrganizationRole"
      responses:
        "201":
          description: Invitation created and emailed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/OrganizationInvitation"
        "403": { $ref: "#/components/responses/Forbidden" }
        "402": { $ref: "#/components/responses/PlanLimitExceeded" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /invitations/accept:
    post:
      tags: [Invitations]
      summary: Accept an invitation with the emailed token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Membership created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  organization_id: { type: string, format: uuid }
        "403":
          description: Invitation was sent to a different email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Invalid or expired invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /invitations/{invitation}:
    delete:
      tags: [Invitations]
      summary: Revoke a pending invitation (requires manage-invitations)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: invitation
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Invitation revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /carriers:
    get:
      tags: [Carriers]
      summary: List carriers (requires view-shipments)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Paginated carriers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Carrier"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Carriers]
      summary: Create a carrier (requires create-shipments)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255 }
                contact_name: { type: string, maxLength: 255, nullable: true }
                contact_email: { type: string, format: email, maxLength: 255, nullable: true }
                contact_phone: { type: string, maxLength: 255, nullable: true }
                dot_number: { type: string, maxLength: 255, nullable: true }
                notes: { type: string, maxLength: 5000, nullable: true }
      responses:
        "201":
          description: Carrier created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Carrier"
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /carriers/{carrier}:
    put:
      tags: [Carriers]
      summary: Update a carrier (requires edit-shipments)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: carrier
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                contact_name: { type: string, maxLength: 255, nullable: true }
                contact_email: { type: string, format: email, maxLength: 255, nullable: true }
                contact_phone: { type: string, maxLength: 255, nullable: true }
                dot_number: { type: string, maxLength: 255, nullable: true }
                notes: { type: string, maxLength: 5000, nullable: true }
      responses:
        "200":
          description: Carrier updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Carrier"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /shipments:
    get:
      tags: [Shipments]
      summary: List shipments (requires view-shipments)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: search
          in: query
          description: Matches reference, broker, driver name, carrier name, and pickup/delivery location
          schema: { type: string }
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ShipmentStatus"
        - name: carrier_id
          in: query
          schema: { type: string, format: uuid }
        - name: date_from
          in: query
          description: Pickup appointment on or after this date
          schema: { type: string, format: date }
        - name: date_to
          in: query
          description: Pickup appointment on or before this date
          schema: { type: string, format: date }
        - name: delivery_date_from
          in: query
          description: Delivery appointment on or after this date
          schema: { type: string, format: date }
        - name: delivery_date_to
          in: query
          description: Delivery appointment on or before this date
          schema: { type: string, format: date }
        - name: amount_min
          in: query
          description: Base rate at or above this amount
          schema: { type: number }
        - name: amount_max
          in: query
          description: Base rate at or below this amount
          schema: { type: number }
        - name: event_type
          in: query
          description: Only shipments with an event in this category (slug, e.g. detention)
          schema: { type: string }
        - name: broker
          in: query
          description: Broker or customer name contains this text
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, pickup_appointment, delivery_appointment, status]
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: page
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Paginated shipments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Shipment"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Shipments]
      summary: Create a shipment (requires create-shipments)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentInput"
      responses:
        "201":
          description: Shipment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Shipment"
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /shipments/export:
    get:
      tags: [Shipments]
      summary: Export the filtered shipment list as CSV (requires export-shipments)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ShipmentStatus"
        - name: carrier_id
          in: query
          schema: { type: string, format: uuid }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
  /shipments/import/preview:
    post:
      tags: [Shipments]
      summary: Preview a CSV import without creating shipments (requires import-shipments)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file, max 5 MB, max 1000 rows
                mapping:
                  type: string
                  description: JSON object of exact header text to shipment field name
      responses:
        "200":
          description: Preview with per-row validation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ImportPreview"
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /shipments/import/confirm:
    post:
      tags: [Shipments]
      summary: Confirm a previewed import (requires import-shipments)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preview_token]
              properties:
                preview_token: { type: string }
                row_indexes:
                  type: array
                  items: { type: integer, minimum: 1 }
                  description: 1-based rows to import; omit to import all valid rows
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ImportResult"
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /shipments/bulk-status:
    post:
      tags: [Shipments]
      summary: Move several shipments to the same status (requires edit-shipments)
      description: >
        Each shipment follows the forward-only transition map and the
        update policy. Shipments that cannot move are reported in
        failed with a reason; the rest still move.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, to_status]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: uuid }
                to_status:
                  $ref: "#/components/schemas/ShipmentStatus"
      responses:
        "200":
          description: Bulk result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BulkIdResult"
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /shipments/bulk-archive:
    post:
      tags: [Shipments]
      summary: Archive several shipments (requires archive-shipments)
      description: >
        Archiving is the bulk-delete equivalent: shipments are never
        hard-deleted. Already archived shipments are reported in
        failed.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Bulk result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BulkIdResult"
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /shipments/{shipment}:
    get:
      tags: [Shipments]
      summary: Show one shipment (requires view-shipments)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: shipment
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Shipment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Shipment"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Shipments]
      summary: Update a shipment (requires edit-shipments)
      description: >
        Status changes must follow the transition map (forward one step,
        or any non-archived status to archived). Archived shipments
        return 403.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: shipment
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentInput"
      responses:
        "200":
          description: Shipment updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Shipment"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /shipments/{shipment}/archive:
    post:
      tags: [Shipments]
      summary: Archive a shipment (requires archive-shipments)
      description: One-way; archived shipments are read-only.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: shipment
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Shipment archived
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Shipment"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /shipments/{shipment}/events:
    get:
      tags: [Events]
      summary: List events for a shipment (requires view-events)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: shipment
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Paginated events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShipmentEvent"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Events]
      summary: Record an event (requires create-events)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: shipment
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentEventInput"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ShipmentEvent"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /event-categories:
    get:
      tags: [Events]
      summary: List visible event categories (requires view-events)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: System categories plus the organization's custom ones
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventCategory"
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Events]
      summary: Add a custom event category (requires create-events)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, maxLength: 255 }
                description: { type: string, maxLength: 1000, nullable: true }
                default_estimated_amount: { type: number, minimum: 0, nullable: true }
                default_currency: { type: string, minLength: 3, maxLength: 3, nullable: true }
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EventCategory"
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /event-categories/{category}:
    put:
      tags: [Events]
      summary: Update an organization category (requires manage-customization)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: category
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 255 }
                description: { type: string, maxLength: 1000, nullable: true }
                is_active: { type: boolean }
                default_estimated_amount: { type: number, minimum: 0, nullable: true }
                default_currency: { type: string, minLength: 3, maxLength: 3, nullable: true }
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EventCategory"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Events]
      summary: Delete an organization category (requires manage-customization)
      description: System categories and categories with events cannot be deleted
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: category
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Category deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /events/{event}:
    get:
      tags: [Events]
      summary: Show one event (requires view-events)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: event
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ShipmentEvent"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Events]
      summary: Update an event (requires edit-events)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: event
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ShipmentEventInput"
                - type: object
                  properties:
                    status:
                      $ref: "#/components/schemas/ShipmentEventStatus"
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ShipmentEvent"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Events]
      summary: Delete an event (requires delete-events)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: event
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Event deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /evidence:
    get:
      tags: [Evidence]
      summary: List evidence files (requires view-evidence)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: shipment_id
          in: query
          schema: { type: string, format: uuid }
        - name: shipment_event_id
          in: query
          schema: { type: string, format: uuid }
        - name: document_category
          in: query
          schema:
            $ref: "#/components/schemas/EvidenceDocumentCategory"
        - name: verification_status
          in: query
          schema:
            $ref: "#/components/schemas/EvidenceVerificationStatus"
        - name: page
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Paginated evidence files
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EvidenceFile"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Evidence]
      summary: Upload an evidence file (requires upload-evidence)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, shipment_id, document_category]
              properties:
                file:
                  type: string
                  format: binary
                  description: Max 20 MB; pdf, jpg, jpeg, png, webp, doc, docx, xls, xlsx, csv, txt
                shipment_id: { type: string, format: uuid }
                shipment_event_id: { type: string, format: uuid }
                document_category:
                  $ref: "#/components/schemas/EvidenceDocumentCategory"
                description: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Evidence uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EvidenceFile"
        "403": { $ref: "#/components/responses/Forbidden" }
        "402": { $ref: "#/components/responses/PlanLimitExceeded" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /evidence/{evidence}:
    get:
      tags: [Evidence]
      summary: Show one evidence record (requires view-evidence)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: evidence
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Evidence metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EvidenceFile"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Evidence]
      summary: Delete an evidence file and its stored object (requires delete-evidence)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: evidence
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Evidence deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /evidence/{evidence}/download:
    get:
      tags: [Evidence]
      summary: Download a file, or preview it inline with ?preview=1 (requires view-evidence)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: evidence
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: preview
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: File bytes, or a redirect to a short-lived S3 signed URL
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /evidence/{evidence}/preview:
    get:
      tags: [Evidence]
      summary: Preview a file inline (requires view-evidence)
      description: >
        Serves images (JPEG, PNG, WebP) and PDFs inline with the
        correct content type. Other file types return 422 with
        previewable false; download those instead.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: evidence
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: File bytes inline, or a redirect to a short-lived S3 signed URL
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /evidence/{evidence}/verification:
    put:
      tags: [Evidence]
      summary: Set the verification status (requires verify-evidence)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: evidence
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification_status]
              properties:
                verification_status:
                  $ref: "#/components/schemas/EvidenceVerificationStatus"
      responses:
        "200":
          description: Verification status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EvidenceFile"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /claims:
    get:
      tags: [Claims]
      summary: List claims (requires view-claims)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: search
          in: query
          description: Matches claim reference, description, broker reference, shipment reference and broker, and carrier name
          schema: { type: string }
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ClaimStatus"
        - name: claim_category
          in: query
          schema:
            $ref: "#/components/schemas/ClaimCategory"
        - name: shipment_id
          in: query
          schema: { type: string, format: uuid }
        - name: amount_min
          in: query
          description: Requested amount at or above this amount
          schema: { type: number }
        - name: amount_max
          in: query
          description: Requested amount at or below this amount
          schema: { type: number }
        - name: deadline_from
          in: query
          description: Submission deadline on or after this date
          schema: { type: string, format: date }
        - name: deadline_to
          in: query
          description: Submission deadline on or before this date
          schema: { type: string, format: date }
        - name: deadline_status
          in: query
          description: overdue or upcoming only count while the claim is still being prepared; none means no deadline set
          schema:
            type: string
            enum: [overdue, upcoming, none]
        - name: event_type
          in: query
          description: Only claims whose event is in this category (slug, e.g. detention)
          schema: { type: string }
        - name: broker
          in: query
          description: Shipment broker or customer name contains this text
          schema: { type: string }
        - name: carrier_id
          in: query
          description: Only claims whose shipment uses this carrier
          schema: { type: string, format: uuid }
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, requested_amount, status, submission_deadline_at]
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc] }
        - name: page
          in: query
          schema: { type: integer }
        - name: per_page
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Paginated claims
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Claim"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Claims]
      summary: Create a claim (requires create-claims)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimInput"
      responses:
        "201":
          description: Claim created with a generated reference
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Claim"
        "403": { $ref: "#/components/responses/Forbidden" }
        "402": { $ref: "#/components/responses/PlanLimitExceeded" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /claims/export:
    get:
      tags: [Claims]
      summary: Export the filtered claim list as CSV (requires export-reports)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: export_template_id
          in: query
          description: Optional claim export template id; without it the default claim columns are used
          schema: { type: string, format: uuid }
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ClaimStatus"
        - name: claim_category
          in: query
          schema:
            $ref: "#/components/schemas/ClaimCategory"
        - name: shipment_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Streaming CSV download
          content:
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /claims/bulk-transition:
    post:
      tags: [Claims]
      summary: Move several claims to the same status
      description: >
        Each claim goes through the transition service with its own
        map, data rules, history row, and audit row. The permission
        depends on the target, as in the single transition endpoint.
        Claims that cannot move are reported in failed with a
        reason; moving to paid is always rejected here.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, to_status]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: uuid }
                to_status:
                  $ref: "#/components/schemas/ClaimStatus"
                reason: { type: string, maxLength: 2000, nullable: true }
                accepted_amount: { type: number, nullable: true }
                rejection_reason: { type: string, maxLength: 2000, nullable: true }
                submitted_at: { type: string, format: date-time, nullable: true }
      responses:
        "200":
          description: Bulk result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BulkClaimResult"
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /claims/bulk-delete:
    post:
      tags: [Claims]
      summary: Delete several claims (requires delete-claims)
      description: >
        Only pre-submission claims can be deleted. Submitted or
        later claims are reported in failed; close those instead.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Bulk result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BulkIdResult"
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /claims/{claim}:
    get:
      tags: [Claims]
      summary: Show one claim (requires view-claims)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: claim
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Claim with shipment, event, active deadline, and allowed transitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Claim"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Claims]
      summary: Update a claim (requires edit-claims)
      description: >
        Amount, currency, category, and event link are frozen once the
        claim is submitted. Status never changes here; use the transition
        endpoint.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: claim
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimInput"
      responses:
        "200":
          description: Claim updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Claim"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /claims/{claim}/transition:
    post:
      tags: [Claims]
      summary: Move a claim to a new status
      description: >
        The permission depends on the target: submit-claims for
        submitted, review-claims for ready_to_submit, accepted,
        partially_accepted, and rejected, edit-claims for the rest.
        Moving to paid is always rejected here; use record-payment.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: claim
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimTransitionInput"
      responses:
        "200":
          description: Claim transitioned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Claim"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /claims/{claim}/review:
    post:
      tags: [Claims]
      summary: Review a claim under review (requires review-claims)
      description: >
        Approve moves the claim to ready_to_submit; request_changes
        moves it back to evidence_required and requires a comment.
        The comment is recorded as a reviewer note and as the reason
        on the status history row.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: claim
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, request_changes]
                comment: { type: string, maxLength: 5000, nullable: true }
      responses:
        "200":
          description: Claim reviewed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Claim"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /claims/{claim}/review-notes:
    get:
      tags: [Claims]
      summary: List the reviewer notes on a claim (requires view-claims)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: claim
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Reviewer notes, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReviewNote"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Claims]
      summary: Add a reviewer note (requires review-claims)
      description: Notes are append-only; closed claims take no more notes.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: claim
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, maxLength: 5000 }
      responses:
        "201":
          description: Note added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReviewNote"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /claims/{claim}/record-payment:
    post:
      tags: [Claims]
      summary: Record a payment and move the claim to paid (requires record-claim-payments)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: claim
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "200":
          description: Payment recorded, claim paid
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Claim"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /claims/{claim}/history:
    get:
      tags: [Claims]
      summary: List the append-only status history of a claim (requires view-claims)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: claim
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Status history, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClaimStatusHistory"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /claims/{claim}/evidence:
    get:
      tags: [Claims]
      summary: List evidence attached to a claim (requires view-claims)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: claim
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Attached evidence files
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EvidenceFile"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Claims]
      summary: Attach an evidence file to a claim (requires attach-claim-evidence)
      description: The evidence must belong to the claim's shipment.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: claim
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidence_file_id]
              properties:
                evidence_file_id: { type: string, format: uuid }
      responses:
        "201":
          description: Evidence attached
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EvidenceFile"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /claims/{claim}/evidence/{evidence}:
    delete:
      tags: [Claims]
      summary: Detach an evidence file from a claim (requires attach-claim-evidence)
      description: Only the link is removed; the file itself is not deleted.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: claim
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: evidence
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Evidence detached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /claims/{claim}/readiness:
    get:
      tags: [Readiness]
      summary: Compute the live readiness breakdown for a claim (requires view-claims)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: claim
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Readiness breakdown with the latest snapshot rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Readiness"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /claims/{claim}/readiness/override:
    post:
      tags: [Readiness]
      summary: Override the readiness assessment with an explanation (requires review-claims)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: claim
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Readiness overridden; the recomputed breakdown is returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Readiness"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /claims/{claim}/deadline:
    post:
      tags: [Deadlines]
      summary: Set the deadline for a claim (requires manage-deadlines)
      description: >
        Upsert: setting a deadline when one is active supersedes the old
        row and creates a new one. Deadlines are customer-supplied only.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: claim
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimDeadlineInput"
      responses:
        "201":
          description: Deadline set
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ClaimDeadline"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /claims/{claim}/package:
    get:
      tags: [Documents]
      summary: The latest generated document for a claim (requires view-claims)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: claim
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Latest document, or null when none exists yet
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/GeneratedDocument"
                  message: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Documents]
      summary: Generate or regenerate the claim package PDF (requires generate-claim-packages)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: claim
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                include_notes:
                  type: boolean
                  default: false
                  description: Include internal notes in the package. Default false.
      responses:
        "202":
          description: Generation queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/GeneratedDocument"
        "403": { $ref: "#/components/responses/Forbidden" }
        "402": { $ref: "#/components/responses/PlanLimitExceeded" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /evidence-requirements:
    get:
      tags: [Readiness]
      summary: List the organization's evidence requirements (requires view-claims)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: page
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Paginated requirements, global first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EvidenceRequirement"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Readiness]
      summary: Create an evidence requirement (requires manage-evidence-requirements)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceRequirementInput"
      responses:
        "201":
          description: Requirement created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EvidenceRequirement"
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /evidence-requirements/{requirement}:
    put:
      tags: [Readiness]
      summary: Update an evidence requirement (requires manage-evidence-requirements)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: requirement
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceRequirementInput"
      responses:
        "200":
          description: Requirement updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EvidenceRequirement"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Readiness]
      summary: Delete an evidence requirement (requires manage-evidence-requirements)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: requirement
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Requirement deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /deadlines:
    get:
      tags: [Deadlines]
      summary: List active deadlines (requires view-deadlines)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DeadlineStatus"
        - name: upcoming_days
          in: query
          schema: { type: integer, description: Only deadlines within this many days }
        - name: page
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Paginated deadlines, earliest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClaimDeadline"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "403": { $ref: "#/components/responses/Forbidden" }
  /deadlines/{deadline}:
    get:
      tags: [Deadlines]
      summary: Show one deadline (requires view-deadlines)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: deadline
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deadline with its claim
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ClaimDeadline"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Deadlines]
      summary: Update a deadline (requires manage-deadlines)
      description: Superseded rows cannot be edited.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: deadline
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimDeadlineInput"
      responses:
        "200":
          description: Deadline updated with its status recomputed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ClaimDeadline"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /documents/{document}/download:
    get:
      tags: [Documents]
      summary: Download a generated claim package PDF (requires view-claims)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: document
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: PDF bytes, or a redirect to a short-lived S3 signed URL
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The document is still queued or failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /audit-logs:
    get:
      tags: [Audit]
      summary: List audit rows (requires view-audit-logs)
      description: >
        Append-only audit trail, newest first. There are no store,
        update, or delete routes for audit rows.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: entity_type
          in: query
          description: Subject entity type, e.g. Shipment, Claim
          schema: { type: string }
        - name: action
          in: query
          description: Action, e.g. shipment.created, claim.status_changed
          schema: { type: string }
        - name: actor_id
          in: query
          description: User id of the actor (system rows have no actor)
          schema: { type: integer }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Audit rows with pagination meta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /notifications:
    get:
      tags: [Notifications]
      summary: List the member's own notifications
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: unread
          in: query
          description: Set to 1 to show unread rows only
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 25, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Notifications with pagination meta and unread_count
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
                  meta:
                    allOf:
                      - $ref: "#/components/schemas/PaginationMeta"
                      - type: object
                        properties:
                          unread_count: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: The member's unread notification count
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      unread_count: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark every unread notification read
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Number of rows marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      marked_read: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /notifications/{notification}/read:
    post:
      tags: [Notifications]
      summary: Mark one notification read
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: notification
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The notification, now read
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Notification"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /notification-preferences:
    get:
      tags: [Notifications]
      summary: The member's notification preferences for all event types
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: One entry per event type, defaults included
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationPreference"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Notifications]
      summary: Save notification preferences for one or more event types
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences]
              properties:
                preferences:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [event_type, in_app, email]
                    properties:
                      event_type:
                        $ref: "#/components/schemas/NotificationType"
                      in_app: { type: boolean }
                      email: { type: boolean }
      responses:
        "200":
          description: The full preference list after the update
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationPreference"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /reports/summary:
    get:
      tags: [Reports]
      summary: Report summary (requires view-reports)
      description: >
        Counts by claim status and event type, and the six money
        figures (potential, submitted, accepted, recovered, rejected,
        outstanding), each grouped by currency and never mixed. See
        docs/API.md for the financial definitions.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: date_from
          in: query
          description: Filter claim and event created_at (inclusive)
          schema: { type: string, format: date }
        - name: date_to
          in: query
          description: Filter claim and event created_at (inclusive)
          schema: { type: string, format: date }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReportSummary"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "402": { $ref: "#/components/responses/PlanLimitExceeded" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /reports/recovery-history:
    get:
      tags: [Reports]
      summary: Recovered money per month per currency (requires view-reports)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: date_from
          in: query
          description: First paid_at date (inclusive). Defaults to 12 months back.
          schema: { type: string, format: date }
        - name: date_to
          in: query
          description: Last paid_at date (inclusive). Defaults to today.
          schema: { type: string, format: date }
      responses:
        "200":
          description: One entry per month that has recovered money
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecoveryHistoryMonth"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "402": { $ref: "#/components/responses/PlanLimitExceeded" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /reports/export:
    get:
      tags: [Reports]
      summary: Export the summary and per-claim rows as CSV (requires export-reports)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: date_from
          in: query
          description: Filter claim created_at (inclusive)
          schema: { type: string, format: date }
        - name: date_to
          in: query
          description: Filter claim created_at (inclusive)
          schema: { type: string, format: date }
      responses:
        "200":
          description: CSV with a summary section then one row per claim
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "402": { $ref: "#/components/responses/PlanLimitExceeded" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /health:
    get:
      tags: [Operations]
      summary: Public health check (no authentication)
      description: >
        Overall status plus per-check status and latency for the
        database, cache, queue, and storage. Returns 200 when the
        status is ok or degraded, 503 when it is down. The queue
        check reports "skipped" unless the database queue driver
        is in use. Intended for load balancers and uptime monitors.
      security: []
      responses:
        "200":
          description: Service is ok or degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Service is down (database or storage check failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /plans:
    get:
      tags: [Marketing]
      summary: Public plan catalog (no authentication)
      description: >
        The listed plans from config/billing.php, the same v0.5.0
        section 8 tiers the pricing page shows, plus the trial
        offer (30 days on Growth, no card). The unlisted Success
        Fee plan is not returned. Rate limit: 30 requests per
        minute.
      security: []
      responses:
        "200":
          description: Listed plans and the trial offer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      plans:
                        type: array
                        items:
                          $ref: "#/components/schemas/BillingPlan"
                      trial:
                        type: object
                        properties:
                          plan: { type: string, example: growth }
                          days: { type: integer, example: 30 }
                          requires_card: { type: boolean, example: false }
  /leads:
    post:
      tags: [Marketing]
      summary: Submit a demo request (no authentication)
      description: >
        Captures a lead from a marketing form. Idempotent by email
        and source: a second submission from the same email within
        90 days updates the existing lead instead of creating a
        duplicate, and returns it with 200. No IP address or user
        agent is stored. Rate limit: 5 requests per minute.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email, maxLength: 255 }
                company: { type: string, maxLength: 255, nullable: true }
                fleet_size: { type: string, maxLength: 50, nullable: true }
                message: { type: string, maxLength: 2000, nullable: true }
                source:
                  type: string
                  enum: [demo_request, pricing, getting_started]
                  default: demo_request
      responses:
        "201":
          description: Lead created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Lead"
        "200":
          description: Existing lead updated (same email and source within 90 days)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Lead"
        "422": { $ref: "#/components/responses/ValidationError" }
  /analytics/events:
    post:
      tags: [Marketing]
      summary: Record an anonymous marketing event (no authentication)
      description: >
        Accepts one page-view or conversion event from the
        marketing tracker. Always answers 202: recording is
        best-effort and must never break the page. Events are
        anonymous (event name, path, optional referrer) and go to
        the driver in config/analytics.php: the log by default, or
        nowhere when the driver is "none". Rate limit: 60 requests
        per minute.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, path]
              properties:
                event:
                  type: string
                  enum: [page_view, demo_request_submitted, trial_started, pricing_viewed]
                path: { type: string, maxLength: 500 }
                referrer: { type: string, maxLength: 500, nullable: true }
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accepted: { type: boolean, example: true }
        "422": { $ref: "#/components/responses/ValidationError" }
  /ops/health:
    get:
      tags: [Operations]
      summary: Detailed health status (requires view-operations)
      description: >
        The public health checks plus the application version,
        PHP and Laravel versions, queue totals, and whether queue
        monitoring is supported on this queue driver.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Detailed health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/OpsHealth"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /ops/queue:
    get:
      tags: [Operations]
      summary: Queue statistics (requires view-operations)
      description: >
        Per-queue pending, reserved, and delayed counts with the
        age of the oldest pending job, plus totals including the
        failed-job count. Only supported on the database queue
        driver; other drivers return supported: false.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Queue statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/QueueStats"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /ops/failed-jobs:
    get:
      tags: [Operations]
      summary: Failed jobs for the organization (requires view-operations)
      description: >
        Paginated failed jobs whose payload resolves to this
        organization. Jobs that cannot be attributed to an
        organization are never listed.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      responses:
        "200":
          description: Paginated failed jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FailedJob"
                  meta:
                    type: object
                    properties:
                      current_page: { type: integer }
                      last_page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /ops/failed-jobs/retry-all:
    post:
      tags: [Operations]
      summary: Re-queue all of the organization's failed jobs (requires view-operations)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Retry counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      retried: { type: integer }
                      failed:
                        type: array
                        items: { type: string, format: uuid }
                        description: UUIDs that could not be re-queued
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /ops/failed-jobs/flush:
    post:
      tags: [Operations]
      summary: Delete old failed jobs of the organization (requires view-operations)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                hours:
                  type: integer
                  minimum: 1
                  maximum: 8760
                  default: 168
                  description: Delete failed jobs older than this many hours
      responses:
        "200":
          description: Deletion count
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /ops/failed-jobs/{uuid}/retry:
    post:
      tags: [Operations]
      summary: Re-queue one failed job (requires view-operations)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Job re-queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /ops/failed-jobs/{uuid}/forget:
    post:
      tags: [Operations]
      summary: Delete one failed job without retrying (requires view-operations)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Job forgotten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /ops/errors:
    get:
      tags: [Operations]
      summary: Recent server errors for the organization (requires view-operations)
      description: >
        Newest-first entries from the errors log, filtered to
        entries recorded with this organization id. The log is
        capped at 512 KB per read.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Recent errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      entries:
                        type: array
                        items:
                          $ref: "#/components/schemas/ErrorEntry"
                      scanned_lines: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /ops/monitoring:
    get:
      tags: [Operations]
      summary: Latest monitoring check run and recent history (requires view-operations)
      description: >
        The latest hourly monitoring run (health checks, failed job
        count, queue depth) and the last 24 runs. A failing check
        writes a warning to the log; there is no alerting channel
        yet.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Monitoring history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      latest:
                        allOf:
                          - $ref: "#/components/schemas/MonitoringCheck"
                        nullable: true
                      history:
                        type: array
                        items:
                          $ref: "#/components/schemas/MonitoringCheck"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /ops/monitoring/check:
    post:
      tags: [Operations]
      summary: Run the monitoring check now (requires view-operations)
      description: >
        Runs the health checks, counts failed jobs and queue depth,
        and stores the result. Always returns 200: a failing check
        is a successful check run with a failing result, not an
        HTTP error.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Monitoring check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MonitoringCheck"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /custom-fields:
    get:
      tags: [Customization]
      summary: List custom field definitions for a resource type
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: resource_type
          in: query
          required: true
          schema: { type: string, enum: [shipment, claim] }
      responses:
        "200":
          description: Custom field definitions in display order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomField"
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Customization]
      summary: Create a custom field definition (requires manage-customization)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_type, label, field_type]
              properties:
                resource_type: { type: string, enum: [shipment, claim] }
                field_key: { type: string, description: Auto-slugged from the label when omitted }
                label: { type: string, maxLength: 255 }
                field_type: { type: string, enum: [text, number, date, select, boolean] }
                is_required: { type: boolean }
                options:
                  type: array
                  items: { type: string }
                  description: Required for select fields, 2 to 20 options
                sort_order: { type: integer, minimum: 0 }
                is_active: { type: boolean }
      responses:
        "201":
          description: Custom field created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CustomField"
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /custom-fields/{field}:
    get:
      tags: [Customization]
      summary: Show one custom field definition
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: field
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Custom field
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CustomField"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Customization]
      summary: Update a custom field definition (requires manage-customization)
      description: The field key is immutable
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: field
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 255 }
                is_required: { type: boolean }
                options:
                  type: array
                  items: { type: string }
                sort_order: { type: integer, minimum: 0 }
                is_active: { type: boolean }
      responses:
        "200":
          description: Custom field updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CustomField"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Customization]
      summary: Delete a custom field definition (requires manage-customization)
      description: Also strips the key from every shipment and claim value map in the organization
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: field
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Custom field deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /evidence-templates:
    get:
      tags: [Customization]
      summary: List evidence templates (requires manage-customization)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Paginated evidence templates with items
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EvidenceTemplate"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Customization]
      summary: Create an evidence template (requires manage-customization)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, items]
              properties:
                name: { type: string, maxLength: 255 }
                description: { type: string, maxLength: 2000, nullable: true }
                is_active: { type: boolean }
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [document_category, label]
                    properties:
                      document_category: { type: string }
                      label: { type: string, maxLength: 255 }
                      is_required: { type: boolean }
                      sort_order: { type: integer, minimum: 0 }
      responses:
        "201":
          description: Evidence template created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EvidenceTemplate"
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /evidence-templates/{template}:
    get:
      tags: [Customization]
      summary: Show one evidence template (requires manage-customization)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: template
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Evidence template
