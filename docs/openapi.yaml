  /backups:
    get:
      tags: [Security]
      summary: List backup runs (requires manage-security)
      description: >
        Backup runs requested by this organization, newest first.
        Scheduled daily runs have no organization and are not
        listed. The file path is never exposed.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Paginated backup runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BackupRun"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Security]
      summary: Create a backup now (requires manage-security)
      description: >
        Copies the whole database plus every evidence and package
        file, with a manifest of SHA-256 checksums. An in-memory
        database or a missing pg_dump returns 422 with the reason
        instead of a fake success.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "201":
          description: Backup run created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BackupRun"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /backups/{backup}:
    get:
      tags: [Security]
      summary: Get one backup run (requires manage-security)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: backup
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Backup run
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BackupRun"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /backups/{backup}/verify:
    post:
      tags: [Security]
      summary: Verify a backup's checksums (requires manage-security)
      description: >
        Re-hashes the database copy and every stored file against
        the backup manifest and returns the list of mismatches.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: backup
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BackupVerification"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /retention:
    get:
      tags: [Security]
      summary: Get retention settings (requires manage-security)
      description: >
        Effective retention settings in days: config defaults
        merged with this organization's overrides. 0 means keep
        forever.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Retention settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/RetentionSettings"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Security]
      summary: Set retention overrides (requires manage-security)
      description: >
        Any of audit_logs, notifications, job_executions,
        failed_documents, security_events: an integer 0 to 3650,
        or null to clear the override and restore the default.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                audit_logs: { type: integer, minimum: 0, maximum: 3650, nullable: true }
                notifications: { type: integer, minimum: 0, maximum: 3650, nullable: true }
                job_executions: { type: integer, minimum: 0, maximum: 3650, nullable: true }
                failed_documents: { type: integer, minimum: 0, maximum: 3650, nullable: true }
                security_events: { type: integer, minimum: 0, maximum: 3650, nullable: true }
      responses:
        "200":
          description: Effective retention settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/RetentionSettings"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /security/check:
    get:
      tags: [Security]
      summary: Production-readiness checks (requires manage-security)
      description: >
        The same ten checks as the security:check artisan command:
        APP_DEBUG, APP_KEY, APP_URL, session cookies, Sanctum token
        expiration, evidence disk, CORS origin, backup freshness,
        mail driver, queue driver.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Security check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SecurityCheckResult"
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /security/events:
    get:
      tags: [Security]
      summary: List security events (requires manage-security)
      description: >
        Failed logins and authorization denials for this
        organization, newest first. The password is never stored
        in a failed-login event. Unattributed events (no
        organization) are not listed here.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Security events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SecurityEvent"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /billing/plans:
    get:
      tags: [Billing]
      summary: List subscription plans
      description: >
        The plan catalog from config/billing.php: Free, Starter $19,
        Growth $49, Fleet $99, Agency $149 base + $12 per extra carrier,
        and the unlisted Success Fee plan ($0 + 15% of amounts recorded
        as paid). Any member may read it; plan limits are shown but not
        enforced until v1.2.1.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Plan catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BillingPlan"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /billing/subscription:
    get:
      tags: [Billing]
      summary: Current subscription (requires manage-billing)
      description: >
        The organization's subscription, with the current period's
        metered usage for the Success Fee plan. A Free subscription is
        created lazily on first read.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Subscription with usage summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/BillingSubscription"
                      - type: object
                        properties:
                          usage:
                            $ref: "#/components/schemas/BillingUsageSummary"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /billing/checkout:
    post:
      tags: [Billing]
      summary: Open a mock checkout session (requires manage-billing)
      description: >
        Checkout moves off Free (or off the Success Fee plan, whose base
        is $0). Paid plans move with change-plan instead. A trialing
        organization checks out to convert the trial early. A past-due
        subscription must pay its invoice first.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { type: string, example: growth }
                interval: { type: string, enum: [monthly, annual], default: monthly }
                extra_carriers: { type: integer, minimum: 0, maximum: 90, default: 0 }
      responses:
        "201":
          description: Checkout session
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BillingCheckoutSession"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /billing/checkout/{session}/complete:
    post:
      tags: [Billing]
      summary: Complete a mock checkout (requires manage-billing)
      description: >
        The mock "customer pays" step. A paid plan needs a payment
        method; Free and Success Fee do not. A declined card leaves the
        session open for a retry. On success the subscription activates,
        a paid invoice is issued, and a checkout.session.completed event
        is recorded through the webhook pipeline.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: session
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_method: { type: string, nullable: true, description: Mock test card token, e.g. pm_mock_visa or pm_mock_declined }
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BillingSubscription"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /billing/trials:
    post:
      tags: [Billing]
      summary: Start the 30-day Growth trial (requires manage-billing)
      description: >
        No card required. The trial converts to paid Growth at the end
        of 30 days when a card is on file; otherwise it lapses to Free.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_method: { type: string, nullable: true }
      responses:
        "201":
          description: Trialing subscription
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BillingSubscription"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /billing/subscription/change-plan:
    post:
      tags: [Billing]
      summary: Change plan, with optional proration preview (requires manage-billing)
      description: >
        With preview=true, returns the proration preview without
        changing anything. An upgrade (higher monthly-equivalent price)
        applies immediately, credited for unused days of the old plan
        and charged for the remaining days of the new plan; a downgrade
        is scheduled for the next renewal. A canceled or past-due
        subscription cannot change plans; a trialing one converts
        through checkout.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { type: string, example: fleet }
                interval: { type: string, enum: [monthly, annual] }
                extra_carriers: { type: integer, minimum: 0, maximum: 90 }
                preview: { type: boolean, default: false }
      responses:
        "200":
          description: Preview, or the changed subscription with its invoice
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      proration:
                        $ref: "#/components/schemas/BillingProration"
                      effective: { type: string, enum: [immediately, at_period_end] }
                      subscription:
                        $ref: "#/components/schemas/BillingSubscription"
                      invoice:
                        $ref: "#/components/schemas/BillingInvoice"
                        nullable: true
                      current_plan: { type: string }
                      current_period_end: { type: string, format: date-time, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /billing/subscription/cancel:
    post:
      tags: [Billing]
      summary: Cancel the subscription (requires manage-billing)
      description: >
        immediate=false cancels at the end of the current period;
        immediate=true cancels now and moves the organization to Free.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                immediate: { type: boolean, default: false }
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BillingSubscription"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /billing/subscription/resume:
    post:
      tags: [Billing]
      summary: Undo a cancel-at-period-end (requires manage-billing)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BillingSubscription"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /billing/invoices:
    get:
      tags: [Billing]
      summary: Invoice history (requires manage-billing)
      description: Invoices for this organization, newest first.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      responses:
        "200":
          description: Paginated invoices
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BillingInvoice"
                  meta:
                    $ref: "#/components/schemas/PaginatedMeta"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /billing/invoices/{invoice}:
    get:
      tags: [Billing]
      summary: One invoice with its lines (requires manage-billing)
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: invoice
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BillingInvoice"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /billing/invoices/{invoice}/pay:
    post:
      tags: [Billing]
      summary: Pay an open or past-due invoice (requires manage-billing)
      description: >
        Pays with the stored payment method, or one supplied now. A
        paid past-due invoice returns the subscription to active.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: invoice
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_method: { type: string, nullable: true }
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BillingInvoice"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /billing/invoices/{invoice}/refund:
    post:
      tags: [Billing]
      summary: Refund a paid invoice in full or in part (requires manage-billing)
      description: >
        No amount_cents means a full refund of the remaining paid
        amount; a full refund sets the invoice status to refunded,
        a partial refund to partially_refunded. The reason is
        required. An amount above the remaining paid amount, a
        refund on an unpaid invoice, or a negative amount is
        rejected. Every refund is an audit row and a billing event
        (invoice.refunded). The provider is asked first with an
        idempotency key, so a retry never refunds twice.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: invoice
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                amount_cents: { type: integer, minimum: 1, nullable: true, description: Omit for a full refund }
                reason: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Refund record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BillingRefund"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /billing/events:
    get:
      tags: [Billing]
      summary: Billing event log for the organization (requires manage-billing)
      description: >
        Subscription, invoice, payment, and refund events, newest
        first. The operator's view of what billing did, and the
        history behind a support ticket about a subscription.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      responses:
        "200":
          description: Billing events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BillingEvent"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /billing/payment-method:
    post:
      tags: [Billing]
      summary: Store a payment method (requires manage-billing)
      description: >
        Stores a dummy payment method (a mock test card token). The
        mock accepts pm_mock_visa (4242, succeeds) and pm_mock_declined
        (4000...0002, declines).
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_method]
              properties:
                payment_method: { type: string, maxLength: 32 }
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BillingSubscription"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /billing/portal:
    post:
      tags: [Billing]
      summary: Open a mock billing portal session (requires manage-billing)
      description: >
        Returns a portal URL (the frontend billing page with a session
        token) and the token itself. The token opens the billing
        summary at GET /billing/portal/{token} and expires after 30
        minutes. Real Stripe replaces this with a Stripe-hosted page.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "201":
          description: Portal session
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BillingPortalSession"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /billing/usage:
    get:
      tags: [Billing]
      summary: Current period metered usage (requires manage-billing)
      description: >
        Uninvoiced success-fee usage records for the current period:
        amounts recorded as paid, the accrued 15% fee, and the
        first-year $49/mo cap with what remains of it.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Usage summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BillingUsageSummary"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /billing/webhooks/simulate:
    post:
      tags: [Billing]
      summary: Fire a mock webhook event through the pipeline (requires manage-billing)
      description: >
        Signs the event with the mock webhook secret, verifies the
        signature, then handles it exactly like a delivered webhook.
        The event is recorded; a redelivery of the same event id is
        recorded as a duplicate and applied once.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, example: invoice.payment_failed }
                data: { type: object }
      responses:
        "201":
          description: Billing event record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      type: { type: string }
                      status: { type: string, enum: [processed, unprocessed, failed, duplicate] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /support/tickets:
    get:
      tags: [Support]
      summary: Support tickets for the organization, newest first
      description: >
        Any member may list tickets. Internal notes are included
        only for owner and admin.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: status
          in: query
          schema: { type: string, enum: [open, in_progress, waiting_on_customer, resolved, closed] }
        - name: category
          in: query
          schema: { type: string, enum: [billing, technical, feature_request, account, other] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Support tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SupportTicket"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Support]
      summary: Open a support ticket with its first message
      description: >
        Any member may open a ticket. Ticket bodies and messages
        are never written to the audit log.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, message]
              properties:
                subject: { type: string, maxLength: 255 }
                category: { type: string, enum: [billing, technical, feature_request, account, other], default: other }
                priority: { type: string, enum: [low, normal, high, urgent], default: normal }
                message: { type: string, maxLength: 5000 }
      responses:
        "201":
          description: Created ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SupportTicket"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /support/tickets/{ticket}:
    get:
      tags: [Support]
      summary: One support ticket with its messages
      description: >
        Internal notes are included only for owner and admin.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: ticket
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Support ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SupportTicket"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /support/tickets/{ticket}/messages:
    post:
      tags: [Support]
      summary: Reply to a support ticket
      description: >
        Any member may reply. A staff reply moves an open or
        resolved ticket to in progress; a customer reply on a
        resolved ticket reopens it. An internal note needs
        manage-support, never changes the status, and never
        notifies the requester. A closed ticket takes no more
        messages (422).
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: ticket
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 5000 }
                internal: { type: boolean, default: false }
      responses:
        "201":
          description: Created message and updated ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      body: { type: string }
                      internal: { type: boolean }
                      created_at: { type: string, format: date-time }
                      ticket:
                        $ref: "#/components/schemas/SupportTicket"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /support/tickets/{ticket}/status:
    post:
      tags: [Support]
      summary: Change a ticket's status (requires manage-support)
      description: >
        Resolving stamps resolved_at; closing stamps closed_at;
        reopening clears both. The change is an audit row without
        the message text.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: ticket
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, in_progress, waiting_on_customer, resolved, closed] }
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SupportTicket"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /email-intake/addresses:
    get:
      tags: [EmailIntake]
      summary: Inbound addresses for the organization
      description: >
        Any member may list addresses. Listing provisions the
        default address for organizations created before v1.3.0.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Inbound addresses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/InboundEmailAddress"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [EmailIntake]
      summary: Create an additional inbound address
      description: >
        Requires manage-email-intake (owner, admin, operations
        manager, dispatcher). The local part is generated as
        {org-slug}-{random6}.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 100, nullable: true }
      responses:
        "201":
          description: Created address
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InboundEmailAddress"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /email-intake/addresses/{address}/regenerate:
    post:
      tags: [EmailIntake]
      summary: Replace an address with a fresh random local part
      description: >
        Requires manage-email-intake. The old address stops
        working immediately.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: address
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Regenerated address
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InboundEmailAddress"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /email-intake/addresses/{address}/deactivate:
    post:
      tags: [EmailIntake]
      summary: Deactivate an inbound address
      description: >
        Requires manage-email-intake. The last active address
        cannot be deactivated (422).
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: address
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deactivated address
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InboundEmailAddress"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /email-intake/emails:
    get:
      tags: [EmailIntake]
      summary: Inbound emails for the organization, newest first
      description: >
        The list is the processing history. Filter by status or
        by matched/unmatched. Any member may list emails.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: status
          in: query
          schema: { type: string, enum: [received, processed, matched, unmatched, failed, dismissed] }
        - name: matched
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Inbound emails
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/InboundEmail"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /email-intake/emails/{email}:
    get:
      tags: [EmailIntake]
      summary: One inbound email with references and attachments
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: email
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Inbound email
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InboundEmail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /email-intake/emails/{email}/match:
    post:
      tags: [EmailIntake]
      summary: Manually match an email to a shipment
      description: >
        Requires manage-email-intake. The email's attachments
        become evidence on the shipment (category other, source
        email named in the description). A dismissed email
        cannot be matched (422).
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: email
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipment_id]
              properties:
                shipment_id: { type: string, format: uuid }
      responses:
        "200":
          description: Matched email
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InboundEmail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /email-intake/emails/{email}/unmatch:
    post:
      tags: [EmailIntake]
      summary: Unmatch an email, returning it to unmatched
      description: >
        Requires manage-email-intake. Evidence already filed on
        the old shipment stays filed.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: email
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500, nullable: true }
      responses:
        "200":
          description: Unmatched email
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InboundEmail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /email-intake/emails/{email}/dismiss:
    post:
      tags: [EmailIntake]
      summary: Dismiss an email after review, with a reason
      description: >
        Requires manage-email-intake. A matched email cannot be
        dismissed; unmatch it first (422).
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: email
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Dismissed email
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InboundEmail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /email-intake/inbound:
    post:
      tags: [EmailIntake]
      summary: Inbound email webhook (public, HMAC-verified)
      description: >
        No Sanctum token: authenticity is verified by HMAC-SHA256
        signature (X-Email-Intake-Signature: sha256=<hex>) over
        the raw body, using the configured webhook secret. The
        payload is the normalized JSON an inbound parse provider
        sends; no real provider is wired yet. An unknown `to`
        address returns 422 with a generic message that never
        says whether the address exists. A repeated message_id
        for the same organization returns the stored email with
        duplicate: true and is not processed twice.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, message_id]
              properties:
                from: { type: string, example: broker@example.com }
                to: { type: string, example: acme-abc123@inbound.claimtrail.local }
                subject: { type: string, nullable: true }
                text_body: { type: string, nullable: true }
                html_body: { type: string, nullable: true }
                message_id: { type: string, example: "<msg-1@example.com>" }
                attachments:
                  type: array
                  items:
                    type: object
                    required: [filename, mime_type, content_base64]
                    properties:
                      filename: { type: string, example: detention-proof.pdf }
                      mime_type: { type: string, example: application/pdf }
                      content_base64: { type: string }
      responses:
        "201":
          description: Stored and processed email
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string, enum: [received, processed, matched, unmatched, failed, dismissed] }
                      matched_shipment_id: { type: string, format: uuid, nullable: true }
                      duplicate: { type: boolean }
        "200":
          description: Duplicate redelivery of an already stored email
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string, enum: [received, processed, matched, unmatched, failed, dismissed] }
                      duplicate: { type: boolean, example: true }
        "401":
          description: Missing or invalid webhook signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422": { $ref: "#/components/responses/ValidationError" }
  /imports/mappings:
    get:
      tags: [Imports]
      summary: Saved CSV mappings for the organization
      description: >
        Defaults first, then by name. Any member may list
        mappings.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Saved mappings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImportMapping"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Imports]
      summary: Save a CSV mapping
      description: >
        Requires manage-imports (owner, admin, operations
        manager, dispatcher). mapping is exact header text to
        shipment field name; every field must be one a mapping
        may target. Names are unique per organization. A new
        default unsets the previous default for the target.
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, mapping]
              properties:
                name: { type: string, maxLength: 100 }
                target: { type: string, enum: [shipments], default: shipments }
                mapping:
                  type: object
                  additionalProperties: { type: string }
                is_default: { type: boolean, default: false }
      responses:
        "201":
          description: Saved mapping
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ImportMapping"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /imports/mappings/{mapping}:
